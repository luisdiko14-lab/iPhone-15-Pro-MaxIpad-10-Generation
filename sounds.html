<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sounds - Settings</title>
    <link rel="stylesheet" href="settings-page.css">
</head>
<body>
    <div class="ios-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="time">20:30</div>
            <div class="status-indicators">
                <span class="carrier">Fri 14 Aug</span>
                <div class="right-indicators">
                    <span class="signal">Verizon 📶</span>
                    <span class="wifi">📶</span>
                    <span class="battery">26% 🔋</span>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="window.location.href='home.html'">
                <span class="back-arrow">‹</span>
                <span>Settings</span>
            </button>
            <h1 class="header-title">Sounds</h1>
        </div>

        <!-- Settings Groups -->
        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">Ringtone</div>
                <div class="setting-value">Reflection</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Text Tone</div>
                <div class="setting-value">Note</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">New Mail</div>
                <div class="setting-value">Ding</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Sent Mail</div>
                <div class="setting-value">Swoosh</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Calendar Alerts</div>
                <div class="setting-value">Chord</div>
                <div class="chevron">›</div>
            </div>
        </div>

        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">Lock Sound</div>
                <div class="toggle-switch active">
                    <div class="toggle-slider"></div>
                </div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Keyboard Clicks</div>
                <div class="toggle-switch active">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </div>

        <div class="section-header">HAPTICS</div>
        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">System Haptics</div>
                <div class="toggle-switch active">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </div>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>
    </div>

    <style>
        .section-header {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 20px 8px;
        }
    </style>
</body>
</html>
