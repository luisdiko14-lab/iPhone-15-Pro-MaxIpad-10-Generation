<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General - Settings</title>
    <link rel="stylesheet" href="settings-page.css">
</head>
<body>
    <div class="ios-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="time">20:30</div>
            <div class="status-indicators">
                <span class="carrier">Fri 14 Aug</span>
                <div class="right-indicators">
                    <span class="signal">Verizon 📶</span>
                    <span class="wifi">📶</span>
                    <span class="battery">26% 🔋</span>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="window.location.href='home.html'">
                <span class="back-arrow">‹</span>
                <span>Settings</span>
            </button>
            <h1 class="header-title">General</h1>
        </div>

        <!-- Settings Groups -->
        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">About</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Software Update</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">AirDrop</div>
                <div class="setting-value">Receiving Off</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">AirPlay & Handoff</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">CarPlay</div>
                <div class="chevron">›</div>
            </div>
        </div>

        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">iPad Storage</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Background App Refresh</div>
                <div class="setting-value">On</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Date & Time</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Keyboard</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Language & Region</div>
                <div class="chevron">›</div>
            </div>
        </div>

        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">VPN & Device Management</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Regulatory</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Reset</div>
                <div class="chevron">›</div>
            </div>
        </div>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>
    </div>
</body>
</html>
