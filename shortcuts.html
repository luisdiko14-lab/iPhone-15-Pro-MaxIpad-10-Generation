<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shortcuts</title>
<style>
:root {
  --bg-color: #000000;
  --card-bg: #1c1c1e;
  --text-primary: #ffffff;
  --text-secondary: #8e8e93;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg-color);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 12px 20px 6px;
  font-size: 13px;
  font-weight: 600;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header {
  padding: 8px 16px 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.header h1 {
  font-size: 34px;
  font-weight: 700;
}
.header-actions {
  color: #007aff;
  font-size: 17px;
  font-weight: 600;
}
.tabs {
  display: flex;
  padding: 0 16px 12px;
  gap: 20px;
  border-bottom: 0.5px solid #38383a;
}
.tab {
  font-size: 17px;
  font-weight: 600;
  color: var(--text-secondary);
}
.tab.active {
  color: #007aff;
}
.content {
  flex: 1;
  padding: 16px;
}
.shortcut-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.shortcut-tile {
  background: #007aff;
  border-radius: 16px;
  padding: 12px;
  height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
}
.st-icon {
  font-size: 24px;
}
.st-name {
  font-size: 15px;
  font-weight: 600;
}
.automation-item {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.au-icon {
  width: 40px;
  height: 40px;
  background: #34c759;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.au-info {
  flex: 1;
}
.au-title {
  font-size: 17px;
  font-weight: 600;
}
.au-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
}
</style>
</head>
<body>
<div class="status-bar">
  <button onclick="history.back()" style="background:none;border:none;color:#007aff;font-size:15px;cursor:pointer">‹ Back</button>
  <span id="st">9:41</span>
  <span>📶 🔋</span>
</div>

<div class="header">
  <h1>Shortcuts</h1>
  <div class="header-actions">Edit</div>
</div>

<div class="tabs">
  <div class="tab active">Shortcuts</div>
  <div class="tab">Automation</div>
  <div class="tab">Gallery</div>
</div>

<div class="content" id="shortcuts-content">
  <div class="shortcut-grid">
    <div class="shortcut-tile" style="background-color: #ff9500;" onclick="runShortcut('Shazam')">
      <div class="st-icon">🎵</div>
      <div class="st-name">Shazam Shortcut</div>
    </div>
    <div class="shortcut-tile" style="background-color: #af52de;" onclick="runShortcut('Home')">
      <div class="st-icon">🏠</div>
      <div class="st-name">Heading Home</div>
    </div>
    <div class="shortcut-tile" style="background-color: #34c759;" onclick="runShortcut('Log Water')">
      <div class="st-icon">💧</div>
      <div class="st-name">Log Water</div>
    </div>
    <div class="shortcut-tile" style="background-color: #007aff;" onclick="runShortcut('Meeting')">
      <div class="st-icon">🗓️</div>
      <div class="st-name">Meeting Mode</div>
    </div>
  </div>
</div>

<script>
function tick(){const d=new Date();document.getElementById('st').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`}
tick();setInterval(tick,1000);

function runShortcut(name) {
  alert(`Running shortcut: ${name}...`);
}
</script>
</body>
</html>
