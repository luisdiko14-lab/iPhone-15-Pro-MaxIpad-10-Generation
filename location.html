<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enable Location</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "San Francisco", Arial;
    background: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    max-width: 300px;
}

.icon {
    font-size: 60px;
    margin-bottom: 20px;
}

h1 {
    font-size: 22px;
    margin-bottom: 10px;
}

p {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 30px;
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    margin-bottom: 10px;
    cursor: pointer;
}

.primary {
    background: #0a84ff;
    color: white;
}

.secondary {
    background: #1c1c1e;
    color: #0a84ff;
}

.result {
    margin-top: 20px;
    font-size: 14px;
    color: #0f0;
}
</style>
</head>

<body>

<div class="container">
    <div class="icon">📍</div>
    <h1>Enable Location Services</h1>
    <p>Allow this app to access your location to show where you are.</p>

    <button class="primary" onclick="getLocation()">Allow While Using App</button>
    <button class="secondary" onclick="deny()">Don't Allow</button>

    <div class="result" id="result"></div>
</div>

<script>
function getLocation() {
    const result = document.getElementById("result");

    if (!navigator.geolocation) {
        result.innerText = "Geolocation not supported.";
        return;
    }

    result.innerText = "Requesting location...";

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            result.innerHTML = `
                ✅ Location Found<br>
                Latitude: ${lat.toFixed(6)}<br>
                Longitude: ${lon.toFixed(6)}
window.location.href = `setup.html?lat=${lat.toFixed(6)}&lng=${lng.toFixed(6)}`;
            `;
        },
        (error) => {
            result.innerText = "❌ Permission denied or unavailable.";
            window.location.href = `setup.html?lat=LocationDenied`;
        }
    );
}

function deny() {
    document.getElementById("result").innerText = "Location access denied.";
}
</script>

</body>
</html>
