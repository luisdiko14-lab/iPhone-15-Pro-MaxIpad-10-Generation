name: Python Server (Fixed 502)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create .env
        run: |
          echo "GROQ_SECRET=${{ secrets.GROQ_SECRET }}" >> .env
          echo "GROK_SECRET=${{ secrets.GROK_SECRET }}" >> .env
          echo "GEMINI_SECRET=${{ secrets.GEMINI_SECRET }}" >> .env
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> .env
          echo "DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}" >> .env
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env

      - name: Install deps
        run: pip install -r requirements.txt || true

      - name: Install cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start server
        run: |
          python server.py > app.log 2>&1 &
      
      # ✅ WAIT UNTIL PORT IS READY
      - name: Wait for server (port 3000)
        run: |
          for i in {1..20}; do
            if nc -z localhost 3000; then
              echo "✅ Server is up!"
              break
            fi
            echo "⏳ Waiting for server..."
            sleep 2
          done

      - name: Start tunnel
        run: |
          ./cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          sleep 8
          echo "🌍 Public URL:"
          grep -o 'https://[-0-9a-z]*\.trycloudflare.com' tunnel.log

      - name: Logs
        run: |
          echo "==== APP LOG ===="
          cat app.log || true
          echo "==== TUNNEL LOG ===="
          cat tunnel.log || true

      - name: Keep alive
        run: sleep 100000000000000
