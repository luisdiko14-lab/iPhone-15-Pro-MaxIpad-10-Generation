name: Python Dev Server with Public URL

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create .env file
        run: |
          echo "GROQ_SECRET=${{ secrets.GROQ_SECRET }}" >> .env
          echo "GROK_SECRET=${{ secrets.GROK_SECRET }}" >> .env
          echo "GEMINI_SECRET=${{ secrets.GEMINI_SECRET }}" >> .env
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> .env
          echo "DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}" >> .env
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || echo "No requirements.txt"

      - name: Install Cloudflare Tunnel
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start Python server (background)
        run: |
          python server.py > app.log 2>&1 &

      - name: Start Cloudflare Tunnel
        run: |
          ./cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          sleep 10
          echo "🌍 Public URL:"
          cat tunnel.log | grep -o 'https://[-0-9a-z]*\.trycloudflare.com'

      - name: Show logs (debug)
        run: |
          echo "==== APP LOG ===="
          cat app.log || true
          echo "==== TUNNEL LOG ===="
          cat tunnel.log || true

      - name: Keep alive (3 min)
        run: sleep 180
