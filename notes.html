<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<link rel="stylesheet" href="settings-page.css">
<style>
  body {
    background: #1c1c1e;
    color: #fff;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    min-height: 100vh;
  }
  .notes-app { max-width: 480px; margin: 0 auto; }
  .notes-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px;
  }
  .notes-header h1 {
    font-size: 28px; font-weight: 700; margin: 0;
  }
  .header-btn {
    background: none; border: none; color: #ffcc00;
    font-size: 16px; cursor: pointer; padding: 6px 10px;
  }
  .header-btn:active { opacity: 0.6; }
  .new-note-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: #ffcc00; color: #000; font-size: 22px; font-weight: 700;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .search-bar-wrap {
    padding: 0 18px 12px;
  }
  .search-bar-wrap input {
    width: 100%; box-sizing: border-box;
    background: rgba(255,255,255,0.08); border: none; outline: none;
    color: #fff; padding: 10px 14px; border-radius: 10px;
    font-size: 15px;
  }
  .notes-list { padding: 0 8px; }
  .note-item {
    background: #2c2c2e; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .note-item:hover { background: #3a3a3c; }
  .note-item:active { transform: scale(0.99); }
  .note-title {
    font-size: 16px; font-weight: 600; margin-bottom: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .note-snippet {
    display: flex; gap: 8px; font-size: 13px; color: #8e8e93;
  }
  .note-time { color: #8e8e93; }
  .note-empty {
    text-align: center; padding: 60px 20px; color: #8e8e93;
    font-size: 15px;
  }
  .editor-screen {
    display: none; position: fixed; inset: 0;
    background: #1c1c1e; padding: 12px 18px 100px;
    flex-direction: column;
  }
  .editor-screen.active { display: flex; }
  .editor-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .editor-title {
    width: 100%; background: none; border: none; outline: none;
    color: #fff; font-size: 22px; font-weight: 700;
    padding: 8px 0;
  }
  .editor-body {
    width: 100%; flex: 1; background: none; border: none; outline: none;
    color: #fff; font-size: 16px; resize: none;
    line-height: 1.5;
    font-family: inherit;
  }
  .delete-btn { color: #ff3b30; }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 18px; font-size: 13px; font-weight: 600; height: 30px;
  }
  .status-bar .right-indicators { display: flex; gap: 6px; align-items: center; font-size: 11px; }
</style>
</head>
<body>
  <div class="notes-app">
    <!-- Status bar -->
    <div class="status-bar">
      <div class="time">12:00</div>
      <div class="status-indicators">
        <span class="carrier">Thu 14 Aug</span>
        <div class="right-indicators">
          <span class="signal">📶</span>
          <span class="wifi">📶</span>
          <span class="battery">87% 🔋</span>
        </div>
      </div>
    </div>

    <!-- List view -->
    <div id="listView">
      <div class="notes-header">
        <button class="header-btn" onclick="goBack()">‹ Home</button>
        <h1>Notes</h1>
        <button class="new-note-btn" onclick="newNote()">+</button>
      </div>
      <div class="search-bar-wrap">
        <input type="text" id="searchInput" placeholder="Search notes..." oninput="renderList()">
      </div>
      <div class="notes-list" id="notesList"></div>
    </div>

    <!-- Editor view -->
    <div class="editor-screen" id="editorView">
      <div class="editor-header">
        <button class="header-btn" onclick="closeEditor()">‹ Notes</button>
        <button class="header-btn delete-btn" onclick="deleteCurrent()">Delete</button>
      </div>
      <input type="text" class="editor-title" id="editorTitle" placeholder="Title" oninput="autosave()">
      <textarea class="editor-body" id="editorBody" placeholder="Start typing..." oninput="autosave()"></textarea>
    </div>
  </div>

  <script src="device-state.js"></script>
  <script>
    const STORE = 'iosNotes';
    let notes = [];
    let currentId = null;

    function load() {
      try { notes = JSON.parse(localStorage.getItem(STORE)) || []; }
      catch (e) { notes = []; }
      if (notes.length === 0) {
        notes = [
          { id: '1', title: 'Welcome to Notes', body: 'Tap + to create a new note.\nYour notes are saved automatically.', updated: Date.now() },
          { id: '2', title: 'Grocery list', body: '• Apples\n• Milk\n• Bread\n• Coffee beans', updated: Date.now() - 3600000 },
        ];
        save();
      }
    }
    function save() { localStorage.setItem(STORE, JSON.stringify(notes)); }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    function fmtTime(ts) {
      const d = new Date(ts);
      const today = new Date();
      const sameDay = d.toDateString() === today.toDateString();
      if (sameDay) return d.toTimeString().slice(0, 5);
      return d.toLocaleDateString();
    }

    function renderList() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase();
      const list = document.getElementById('notesList');
      const filtered = notes
        .filter(n => (n.title + ' ' + n.body).toLowerCase().includes(q))
        .sort((a, b) => b.updated - a.updated);
      if (filtered.length === 0) {
        list.innerHTML = '<div class="note-empty">No notes yet. Tap + to add one.</div>';
        return;
      }
      list.innerHTML = filtered.map(n => `
        <div class="note-item" onclick="openNote('${n.id}')">
          <div class="note-title">${escapeHtml(n.title || 'New Note')}</div>
          <div class="note-snippet">
            <span class="note-time">${fmtTime(n.updated)}</span>
            <span>${escapeHtml((n.body || 'No additional text').slice(0, 60))}</span>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    }

    function newNote() {
      const n = { id: uid(), title: '', body: '', updated: Date.now() };
      notes.unshift(n);
      save();
      openNote(n.id);
    }

    function openNote(id) {
      currentId = id;
      const n = notes.find(x => x.id === id);
      if (!n) return;
      document.getElementById('editorTitle').value = n.title;
      document.getElementById('editorBody').value = n.body;
      document.getElementById('listView').style.display = 'none';
      document.getElementById('editorView').classList.add('active');
      setTimeout(() => document.getElementById('editorTitle').focus(), 100);
    }

    function closeEditor() {
      autosave();
      currentId = null;
      document.getElementById('editorView').classList.remove('active');
      document.getElementById('listView').style.display = 'block';
      renderList();
    }

    let saveTimer;
    function autosave() {
      if (!currentId) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        const n = notes.find(x => x.id === currentId);
        if (!n) return;
        n.title = document.getElementById('editorTitle').value;
        n.body = document.getElementById('editorBody').value;
        n.updated = Date.now();
        save();
      }, 250);
    }

    function deleteCurrent() {
      if (!currentId) return;
      if (!confirm('Delete this note?')) return;
      notes = notes.filter(n => n.id !== currentId);
      save();
      closeEditor();
    }

    function goBack() { window.location.href = 'homescreen.html'; }

    load();
    renderList();
  </script>
</body>
</html>
