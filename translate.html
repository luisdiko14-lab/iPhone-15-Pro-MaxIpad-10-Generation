<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translate</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;min-height:100vh;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.status-bar{display:flex;justify-content:space-between;padding:12px 20px 6px;font-size:13px;font-weight:600}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 12px}
.header h1{font-size:28px;font-weight:700}
.lang-bar{display:flex;align-items:center;gap:0;padding:0 14px 12px}
.lang-btn{flex:1;background:#1c1c1e;border:none;color:#fff;padding:10px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:background .15s}
.lang-btn:active{background:#2c2c2e}
.lang-btn .lang-name{font-size:15px;font-weight:600}
.lang-btn .lang-native{font-size:11px;color:#8e8e93;margin-top:2px}
.swap-btn{width:44px;height:44px;background:none;border:none;color:#007aff;font-size:24px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .3s}
.swap-btn.swapping{transform:rotate(180deg)}
.input-area{background:#1c1c1e;margin:0 14px 10px;border-radius:16px;padding:16px;min-height:120px;display:flex;flex-direction:column}
.input-area textarea{flex:1;background:none;border:none;color:#fff;font-size:22px;font-weight:400;outline:none;resize:none;min-height:80px;font-family:inherit;line-height:1.4}
.input-area textarea::placeholder{color:#3a3a3c}
.input-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.input-actions{display:flex;gap:8px}
.ia-btn{background:none;border:none;color:#8e8e93;font-size:18px;cursor:pointer;padding:4px;transition:color .15s}
.ia-btn:hover{color:#fff}
.char-count{font-size:12px;color:#8e8e93}
.translate-btn{background:#007aff;color:#fff;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin:0 14px 10px;transition:background .15s}
.translate-btn:hover{background:#0060df}
.translate-btn:disabled{background:#2c2c2e;color:#8e8e93;cursor:not-allowed}
.output-area{background:#1c2840;margin:0 14px 10px;border-radius:16px;padding:16px;min-height:120px;display:flex;flex-direction:column;transition:opacity .3s}
.output-area.empty{opacity:.5}
.output-text{font-size:22px;font-weight:400;line-height:1.4;flex:1;color:#fff}
.output-text.placeholder{color:#3a3a3c;font-size:18px}
.output-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.output-actions{display:flex;gap:8px}
.oa-btn{background:none;border:none;color:#8e8e93;font-size:18px;cursor:pointer;padding:4px}
.oa-btn:hover{color:#fff}
.model-tag{font-size:11px;color:#5e5ce6;background:rgba(94,92,230,.15);padding:3px 8px;border-radius:10px}
.loading{display:flex;align-items:center;gap:10px;color:#8e8e93;font-size:15px;padding:20px 0}
.loading-dot{width:8px;height:8px;border-radius:50%;background:#007aff;animation:bounce .8s infinite}
.loading-dot:nth-child(2){animation-delay:.15s}
.loading-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
/* History */
.history-section{flex:1;overflow-y:auto;padding:0 14px 20px}
.section-hdr{font-size:13px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px;padding:8px 0 6px}
.hist-item{background:#1c1c1e;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:background .15s}
.hist-item:hover{background:#2c2c2e}
.hist-langs{font-size:11px;color:#8e8e93;margin-bottom:5px}
.hist-src{font-size:14px;color:#8e8e93;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-tgt{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-del{float:right;background:none;border:none;color:#8e8e93;font-size:16px;cursor:pointer;margin-left:8px}
.hist-del:hover{color:#ff3b30}
/* Lang picker */
.lang-picker{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.lp-inner{background:#1c1c1e;border-radius:20px 20px 0 0;padding:16px 0 40px;width:100%;max-width:480px;max-height:70vh;overflow-y:auto}
.lp-header{display:flex;justify-content:space-between;align-items:center;padding:0 18px 12px;border-bottom:1px solid #2c2c2e;margin-bottom:8px}
.lp-header h3{font-size:18px;font-weight:700}
.lp-close{background:none;border:none;color:#007aff;font-size:16px;cursor:pointer}
.lp-item{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;cursor:pointer;font-size:16px}
.lp-item:hover{background:#2c2c2e}
.lp-item.selected{color:#007aff}
.lp-item .check{color:#007aff;font-size:18px}
</style>
</head>
<body>
<div class="status-bar">
  <button onclick="history.back()" style="background:none;border:none;color:#007aff;font-size:15px;cursor:pointer">‹ Back</button>
  <span id="st">9:41</span>
  <span>📶 🔋</span>
</div>
<div class="header">
  <h1>Translate</h1>
  <button onclick="clearAll()" style="background:none;border:none;color:#8e8e93;font-size:14px;cursor:pointer">Clear</button>
</div>

<!-- Language selector -->
<div class="lang-bar">
  <button class="lang-btn" id="from-btn" onclick="openPicker('from')">
    <div class="lang-name" id="from-name">English</div>
    <div class="lang-native" id="from-native">English</div>
  </button>
  <button class="swap-btn" id="swap-btn" onclick="swapLangs()">⇄</button>
  <button class="lang-btn" id="to-btn" onclick="openPicker('to')">
    <div class="lang-name" id="to-name">Spanish</div>
    <div class="lang-native" id="to-native">Español</div>
  </button>
</div>

<!-- Input -->
<div class="input-area">
  <textarea id="source-text" placeholder="Enter text" rows="3" oninput="onInput()"></textarea>
  <div class="input-footer">
    <div class="input-actions">
      <button class="ia-btn" onclick="startVoiceInput()" title="Voice Input">🎤</button>
      <button class="ia-btn" onclick="speakSource()" title="Speak">🔊</button>
      <button class="ia-btn" onclick="clearSource()" title="Clear">✕</button>
    </div>
    <span class="char-count" id="char-count">0</span>
  </div>
</div>

<button class="translate-btn" id="translate-btn" onclick="doTranslate()">Translate</button>

<!-- Output -->
<div class="output-area" id="output-area">
  <div id="output-content">
    <div class="output-text placeholder">Translation will appear here</div>
  </div>
  <div class="output-footer">
    <div class="output-actions">
      <button class="oa-btn" onclick="speakOutput()" title="Speak">🔊</button>
      <button class="oa-btn" onclick="copyOutput()" title="Copy">📋</button>
    </div>
    <span class="model-tag" id="model-tag" style="display:none">AI</span>
  </div>
</div>

<!-- History -->
<div class="history-section">
  <div class="section-hdr">Recent Translations</div>
  <div id="history-list"></div>
</div>

<!-- Language picker -->
<div class="lang-picker" id="lang-picker" style="display:none" onclick="if(event.target===this)closePicker()">
  <div class="lp-inner">
    <div class="lp-header">
      <h3 id="lp-title">Choose Language</h3>
      <button class="lp-close" onclick="closePicker()">Done</button>
    </div>
    <div id="lp-items"></div>
  </div>
</div>

<script>
function tick(){const d=new Date();document.getElementById('st').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`}
tick();setInterval(tick,1000);

const LANGS=[
  {code:'en',name:'English',native:'English'},
  {code:'es',name:'Spanish',native:'Español'},
  {code:'fr',name:'French',native:'Français'},
  {code:'de',name:'German',native:'Deutsch'},
  {code:'it',name:'Italian',native:'Italiano'},
  {code:'pt',name:'Portuguese',native:'Português'},
  {code:'ru',name:'Russian',native:'Русский'},
  {code:'zh',name:'Chinese',native:'中文'},
  {code:'ja',name:'Japanese',native:'日本語'},
  {code:'ko',name:'Korean',native:'한국어'},
  {code:'ar',name:'Arabic',native:'العربية'},
  {code:'hi',name:'Hindi',native:'हिन्दी'},
  {code:'nl',name:'Dutch',native:'Nederlands'},
  {code:'pl',name:'Polish',native:'Polski'},
  {code:'sv',name:'Swedish',native:'Svenska'},
  {code:'tr',name:'Turkish',native:'Türkçe'},
  {code:'uk',name:'Ukrainian',native:'Українська'},
  {code:'vi',name:'Vietnamese',native:'Tiếng Việt'},
  {code:'th',name:'Thai',native:'ภาษาไทย'},
  {code:'el',name:'Greek',native:'Ελληνικά'},
];

let fromLang=JSON.parse(localStorage.getItem('translateFrom')||'{"code":"en","name":"English","native":"English"}');
let toLang=JSON.parse(localStorage.getItem('translateTo')||'{"code":"es","name":"Spanish","native":"Español"}');
let pickerTarget='from';
let history_=JSON.parse(localStorage.getItem('translateHistory')||'[]');
let lastTranslation='';

function save(){localStorage.setItem('translateFrom',JSON.stringify(fromLang));localStorage.setItem('translateTo',JSON.stringify(toLang));localStorage.setItem('translateHistory',JSON.stringify(history_));}

function refreshLangBtns(){
  document.getElementById('from-name').textContent=fromLang.name;
  document.getElementById('from-native').textContent=fromLang.native;
  document.getElementById('to-name').textContent=toLang.name;
  document.getElementById('to-native').textContent=toLang.native;
}
refreshLangBtns();

function swapLangs(){
  const sb=document.getElementById('swap-btn');
  sb.classList.add('swapping');
  setTimeout(()=>sb.classList.remove('swapping'),300);
  [fromLang,toLang]=[toLang,fromLang];
  // also swap text
  const src=document.getElementById('source-text').value;
  const out=lastTranslation;
  document.getElementById('source-text').value=out;
  setOutput(src,'swapped');
  lastTranslation=src;
  refreshLangBtns();save();
}

function onInput(){
  const v=document.getElementById('source-text').value;
  document.getElementById('char-count').textContent=v.length;
  document.getElementById('translate-btn').disabled=!v.trim();
}

function clearSource(){document.getElementById('source-text').value='';document.getElementById('char-count').textContent='0';setOutput('','');lastTranslation='';document.getElementById('translate-btn').disabled=true;}
function clearAll(){clearSource();history_=[];save();renderHistory();}

async function doTranslate(){
   const text=document.getElementById('source-text').value.trim();
   if(!text)return;
   const btn=document.getElementById('translate-btn');
   btn.disabled=true;btn.textContent='Translating…';
   setLoading(true);
   try{
     // Try Groq AI endpoint
     const res=await fetch('/api/siri/groq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
       message:`Translate the following text from ${fromLang.name} to ${toLang.name}. Return ONLY the translation, no explanation, no quotes, no extra text.\n\nText to translate: ${text}`,
       model:'llama-3.1-8b-instant',
     })});
     const data=await res.json();
     const translated=data.reply||data.text||data.response||'';
     if(translated){
       setOutput(translated,'groq:llama-3.1-8b-instant');lastTranslation=translated;
       history_.unshift({from:fromLang.code,to:toLang.code,fromName:fromLang.name,toName:toLang.name,src:text,tgt:translated,ts:Date.now()});
       if(history_.length>20)history_.pop();
       save();renderHistory();
     } else {
       setOutput(localTranslate(text),'local');
     }
   } catch(e){
     setOutput(localTranslate(text),'local');
   } finally{
     btn.disabled=false;btn.textContent='Translate';setLoading(false);
   }
}

function startVoiceInput() {
  if (!('webkitSpeechRecognition' in window)) {
    alert('Voice recognition not supported in this browser.');
    return;
  }
  const recognition = new webkitSpeechRecognition();
  recognition.lang = fromLang.code;
  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    document.getElementById('source-text').value = text;
    onInput();
    doTranslate();
  };
  recognition.start();
}

// Simple built-in word lookup as fallback
function localTranslate(text){
  const phrases={
    'hello':{'es':'Hola','fr':'Bonjour','de':'Hallo','it':'Ciao','ja':'こんにちは','zh':'你好','ar':'مرحبا','ru':'Привет','ko':'안녕하세요','pt':'Olá'},
    'thank you':{'es':'Gracias','fr':'Merci','de':'Danke','it':'Grazie','ja':'ありがとう','zh':'谢谢','ar':'شكرا','ru':'Спасибо','ko':'감사합니다','pt':'Obrigado'},
    'goodbye':{'es':'Adiós','fr':'Au revoir','de':'Auf Wiedersehen','it':'Arrivederci','ja':'さようなら','zh':'再见','ar':'وداعا','ru':'До свидания','ko':'안녕히 가세요','pt':'Adeus'},
    'yes':{'es':'Sí','fr':'Oui','de':'Ja','it':'Sì','ja':'はい','zh':'是','ar':'نعم','ru':'Да','ko':'예','pt':'Sim'},
    'no':{'es':'No','fr':'Non','de':'Nein','it':'No','ja':'いいえ','zh':'不','ar':'لا','ru':'Нет','ko':'아니요','pt':'Não'},
    'please':{'es':'Por favor','fr':'S\'il vous plaît','de':'Bitte','it':'Per favore','ja':'お願いします','zh':'请','ar':'من فضلك','ru':'Пожалуйста','ko':'부탁합니다','pt':'Por favor'},
    'sorry':{'es':'Lo siento','fr':'Désolé','de':'Entschuldigung','it':'Mi dispiace','ja':'すみません','zh':'对不起','ar':'آسف','ru':'Извините','ko':'죄송합니다','pt':'Desculpe'},
    'good morning':{'es':'Buenos días','fr':'Bonjour','de':'Guten Morgen','it':'Buongiorno','ja':'おはようございます','zh':'早上好','ar':'صباح الخير','ru':'Доброе утро','ko':'좋은 아침','pt':'Bom dia'},
    'how are you':{'es':'¿Cómo estás?','fr':'Comment allez-vous?','de':'Wie geht es Ihnen?','it':'Come stai?','ja':'お元気ですか','zh':'你好吗','ar':'كيف حالك','ru':'Как вы?','ko':'어떻게 지내세요','pt':'Como vai?'},
    'i love you':{'es':'Te amo','fr':'Je t\'aime','de':'Ich liebe dich','it':'Ti amo','ja':'愛してる','zh':'我爱你','ar':'أحبك','ru':'Я люблю тебя','ko':'사랑해','pt':'Eu te amo'},
  };
  const lower=text.toLowerCase().trim();
  const toCode=toLang.code;
  if(phrases[lower]&&phrases[lower][toCode])return phrases[lower][toCode];
  return `[Translation unavailable offline — connect to the internet for AI translation of: "${text}"]`;
}

function setOutput(text,model){
  const content=document.getElementById('output-content');
  const tag=document.getElementById('model-tag');
  if(!text){content.innerHTML='<div class="output-text placeholder">Translation will appear here</div>';tag.style.display='none';return;}
  content.innerHTML=`<div class="output-text" style="white-space:pre-wrap">${text}</div>`;
  tag.style.display=model&&model!=='swapped'?'inline':'none';
  tag.textContent=model==='local'?'Offline':'AI';
}
function setLoading(on){
  if(on)document.getElementById('output-content').innerHTML=`<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div><span>Translating…</span></div>`;
}

function speakSource(){
  const text=document.getElementById('source-text').value;
  if(!text||!window.speechSynthesis)return;
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang=fromLang.code;
  speechSynthesis.speak(utt);
}
function speakOutput(){
  if(!lastTranslation||!window.speechSynthesis)return;
  const utt=new SpeechSynthesisUtterance(lastTranslation);
  utt.lang=toLang.code;
  speechSynthesis.speak(utt);
}
function copyOutput(){
  if(!lastTranslation)return;
  navigator.clipboard.writeText(lastTranslation).then(()=>{
    const btn=document.querySelector('.oa-btn[onclick="copyOutput()"]');
    btn.textContent='✅';setTimeout(()=>btn.textContent='📋',1500);
  });
}

function openPicker(target){
  pickerTarget=target;
  document.getElementById('lp-title').textContent=target==='from'?'Translate from…':'Translate to…';
  const cur=target==='from'?fromLang:toLang;
  document.getElementById('lp-items').innerHTML=LANGS.map(l=>`<div class="lp-item${l.code===cur.code?' selected':''}" onclick="selectLang('${l.code}')">
    <span>${l.name} — ${l.native}</span>
    ${l.code===cur.code?'<span class="check">✓</span>':''}
  </div>`).join('');
  document.getElementById('lang-picker').style.display='flex';
}
function closePicker(){document.getElementById('lang-picker').style.display='none';}
function selectLang(code){
  const lang=LANGS.find(l=>l.code===code);
  if(!lang)return;
  if(pickerTarget==='from')fromLang=lang; else toLang=lang;
  refreshLangBtns();save();closePicker();
}

function renderHistory(){
  const list=document.getElementById('history-list');
  if(!history_.length){list.innerHTML='<div style="color:#8e8e93;font-size:14px;text-align:center;padding:20px 0">No recent translations</div>';return;}
  list.innerHTML=history_.map((h,i)=>`<div class="hist-item" onclick="loadHistory(${i})">
    <div class="hist-langs">${h.fromName} → ${h.toName}<button class="hist-del" onclick="event.stopPropagation();deleteHistory(${i})">×</button></div>
    <div class="hist-src">${h.src}</div>
    <div class="hist-tgt">${h.tgt}</div>
  </div>`).join('');
}
function loadHistory(i){
  const h=history_[i];
  fromLang=LANGS.find(l=>l.code===h.from)||fromLang;
  toLang=LANGS.find(l=>l.code===h.to)||toLang;
  refreshLangBtns();
  document.getElementById('source-text').value=h.src;
  onInput();
  setOutput(h.tgt,'groq:llama-3.1-8b-instant');
  lastTranslation=h.tgt;
}
function deleteHistory(i){history_.splice(i,1);save();renderHistory();}

document.getElementById('translate-btn').disabled=true;
renderHistory();
</script>
</body>
</html>
