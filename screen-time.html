<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Time - Settings</title>
    <link rel="stylesheet" href="settings-page.css">
</head>
<body>
    <div class="ios-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="time">20:30</div>
            <div class="status-indicators">
                <span class="carrier">Fri 14 Aug</span>
                <div class="right-indicators">
                    <span class="signal">Verizon 📶</span>
                    <span class="wifi">📶</span>
                    <span class="battery">26% 🔋</span>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="window.location.href='home.html'">
                <span class="back-arrow">‹</span>
                <span>Settings</span>
            </button>
            <h1 class="header-title">Screen Time</h1>
        </div>

        <!-- Screen Time Chart -->
        <div class="screen-time-chart">
            <div class="chart-container">
                <div class="daily-average">
                    <div class="time-display">3h 24m</div>
                    <div class="time-label">Daily Average</div>
                </div>
                <div class="chart-bar">
                    <div class="bar-fill" style="height: 60%;"></div>
                </div>
            </div>
        </div>

        <!-- Settings Groups -->
        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">App Limits</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Downtime</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Always Allowed</div>
                <div class="chevron">›</div>
            </div>
        </div>

        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">Screen Time Passcode</div>
                <div class="chevron">›</div>
            </div>
        </div>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>
    </div>

    <style>
        .screen-time-chart {
            padding: 20px;
            background-color: var(--bg-secondary);
            margin: 0 20px 20px;
            border-radius: 10px;
        }

        .chart-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .daily-average {
            text-align: center;
        }

        .time-display {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .time-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .chart-bar {
            flex: 1;
            height: 80px;
            background-color: var(--bg-tertiary);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, #5856d6, #7b79e0);
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease;
        }
    </style>

    <script src="screen-time.js"></script>
    <script src="device-state.js"></script>
</body>
</html>
