<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safari</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1c1c1e; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; height: 100vh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; overflow: hidden; }
.status-bar { display: flex; justify-content: space-between; padding: 12px 20px 6px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.toolbar { background: #2c2c2e; padding: 8px 10px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; border-bottom: 1px solid #3a3a3c; }
.url-bar { flex: 1; display: flex; align-items: center; background: #3a3a3c; border-radius: 10px; padding: 0 10px; height: 36px; gap: 6px; cursor: pointer; min-width: 0; }
.url-bar .lock { font-size: 12px; color: #8e8e93; flex-shrink: 0; }
.url-display { font-size: 14px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: center; }
.url-input-wrap { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; flex-direction: column; align-items: center; padding-top: 60px; }
.url-input-wrap.open { display: flex; }
.url-input-inner { background: #2c2c2e; width: 90%; border-radius: 14px; padding: 10px 14px; }
.url-input-inner input { background: #3a3a3c; border: none; color: #fff; padding: 10px 12px; border-radius: 8px; width: 100%; font-size: 15px; outline: none; margin-bottom: 8px; }
.url-input-inner input::placeholder { color: #8e8e93; }
.suggestions { list-style: none; }
.suggestions li { padding: 11px 4px; border-top: 1px solid #3a3a3c; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.suggestions li:hover { background: #3a3a3c; border-radius: 6px; }
.sug-icon { font-size: 16px; }
.cancel-btn { margin-top: 10px; color: #007aff; font-size: 16px; cursor: pointer; }
.toolbar-btn { background: none; border: none; color: #007aff; font-size: 20px; padding: 4px 8px; cursor: pointer; flex-shrink: 0; }
.toolbar-btn:disabled { color: #8e8e93; }
.browser-frame { flex: 1; position: relative; overflow: hidden; }
iframe#webview { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
.blocked-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; background: #1c1c1e; }
.blocked-msg .icon { font-size: 60px; margin-bottom: 20px; }
.blocked-msg h2 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
.blocked-msg p { font-size: 14px; color: #8e8e93; margin-bottom: 20px; line-height: 1.5; }
.open-ext-btn { background: #007aff; color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-size: 16px; cursor: pointer; }
.start-page { position: absolute; inset: 0; overflow-y: auto; padding: 20px; }
.start-page h2 { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
.favorites-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.fav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.fav-icon { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.fav-label { font-size: 11px; color: #8e8e93; text-align: center; }
.history-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #3a3a3c; cursor: pointer; }
.history-item:first-child { border-top: none; }
.history-icon { width: 32px; height: 32px; border-radius: 7px; background: #3a3a3c; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.history-info .ht { font-size: 14px; }
.history-info .hu { font-size: 12px; color: #8e8e93; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.bottom-bar { background: #2c2c2e; display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); flex-shrink: 0; border-top: 1px solid #3a3a3c; }
.bb-btn { background: none; border: none; color: #007aff; font-size: 20px; padding: 6px 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.bb-btn span { font-size: 11px; color: #8e8e93; }
.bb-btn:disabled { color: #8e8e93; }
.loading-bar { height: 3px; background: #007aff; position: absolute; top: 0; left: 0; transition: width 0.3s; z-index: 5; }
</style>
</head>
<body>
<div class="status-bar">
  <span id="st">9:41</span>
  <span>📶 🔋</span>
</div>

<div class="toolbar">
  <button class="toolbar-btn" id="back-btn" onclick="goBack()" disabled>‹</button>
  <button class="toolbar-btn" id="fwd-btn" onclick="goForward()" disabled>›</button>
  <div class="url-bar" onclick="openSearch()">
    <span class="lock">🔒</span>
    <span class="url-display" id="url-display">Search or enter website name</span>
  </div>
  <button class="toolbar-btn" onclick="reload()">↻</button>
</div>

<div class="browser-frame" id="browser-frame">
  <div class="loading-bar" id="loading-bar" style="width:0"></div>
  <div class="start-page" id="start-page">
    <h2>Favorites</h2>
    <div class="favorites-grid" id="fav-grid"></div>
    <h2>History</h2>
    <div id="history-list"></div>
  </div>
  <div class="blocked-msg" id="blocked-msg" style="display:none">
    <div class="icon">🔒</div>
    <h2>This page can't be displayed</h2>
    <p>This site has restricted embedding. You can still open it in your full browser.</p>
    <button class="open-ext-btn" id="ext-btn" onclick="openExternal()">Open in Browser</button>
  </div>
  <iframe id="webview" src="" style="display:none" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" onload="frameLoaded()" onerror="frameError()"></iframe>
</div>

<div class="url-input-wrap" id="url-wrap">
  <div class="url-input-inner">
    <input type="url" id="url-input" placeholder="Search or enter website name" autofocus inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="urlKeyDown(event)" oninput="updateSuggestions()">
    <ul class="suggestions" id="suggestions"></ul>
  </div>
  <span class="cancel-btn" onclick="closeSearch()">Cancel</span>
</div>

<div class="bottom-bar">
  <button class="bb-btn" onclick="goBack()" id="bb-back"><span style="font-size:22px">‹</span><span></span></button>
  <button class="bb-btn" onclick="goForward()" id="bb-fwd"><span style="font-size:22px">›</span><span></span></button>
  <button class="bb-btn" onclick="share()"><span>⬆️</span><span>Share</span></button>
  <button class="bb-btn" onclick="bookmark()"><span>📖</span><span>Bookmarks</span></button>
  <button class="bb-btn" onclick="history.back()"><span>⊞</span><span>Tabs</span></button>
</div>

<script>
let history_ = JSON.parse(localStorage.getItem('safariHistory') || '[]');
let historyIdx = -1;
let currentUrl = '';

const FAVORITES = [
  { label: 'Google', url: 'https://www.google.com', icon: '🔍', bg: '#fff' },
  { label: 'YouTube', url: 'https://www.youtube.com', icon: '▶️', bg: '#ff0000' },
  { label: 'Wikipedia', url: 'https://en.m.wikipedia.org', icon: '📖', bg: '#fff' },
  { label: 'GitHub', url: 'https://github.com', icon: '🐙', bg: '#1c1c1e' },
  { label: 'Reddit', url: 'https://www.reddit.com', icon: '🤖', bg: '#ff4500' },
  { label: 'Twitter', url: 'https://twitter.com', icon: '🐦', bg: '#1da1f2' },
  { label: 'Maps', url: 'https://www.openstreetmap.org', icon: '🗺️', bg: '#4caf50' },
  { label: 'News', url: 'https://news.google.com', icon: '📰', bg: '#1a73e8' },
];
const EMBEDDABLE = ['en.m.wikipedia.org', 'www.openstreetmap.org', 'openstreetmap.org'];

function tick() { const d=new Date(); document.getElementById('st').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
tick(); setInterval(tick,1000);

function renderFavorites() {
  const g = document.getElementById('fav-grid');
  g.innerHTML = FAVORITES.map(f => `<div class="fav-item" onclick="navigate('${f.url}')">
    <div class="fav-icon" style="background:${f.bg}">${f.icon}</div>
    <span class="fav-label">${f.label}</span>
  </div>`).join('');
}
function renderHistory() {
  const h = document.getElementById('history-list');
  const recent = history_.slice(0, 10);
  if (!recent.length) { h.innerHTML = '<p style="color:#8e8e93;font-size:14px">No history yet</p>'; return; }
  h.innerHTML = recent.map(item => `<div class="history-item" onclick="navigate('${item.url}')">
    <div class="history-icon">🌐</div>
    <div class="history-info"><div class="ht">${item.title || item.url}</div><div class="hu">${item.url}</div></div>
  </div>`).join('');
}

function openSearch() {
  document.getElementById('url-wrap').classList.add('open');
  const inp = document.getElementById('url-input');
  inp.value = currentUrl;
  inp.focus(); inp.select();
  updateSuggestions();
}
function closeSearch() { document.getElementById('url-wrap').classList.remove('open'); }

function updateSuggestions() {
  const q = document.getElementById('url-input').value.trim().toLowerCase();
  const list = document.getElementById('suggestions');
  if (!q) { list.innerHTML = ''; return; }
  const matches = FAVORITES.filter(f => f.label.toLowerCase().includes(q) || f.url.includes(q));
  const items = matches.map(f => `<li onclick="navigate('${f.url}');closeSearch()"><span class="sug-icon">${f.icon}</span>${f.label} — ${f.url}</li>`);
  if (!isNaN(q[0]) || q.includes('.') || q.startsWith('http')) {
    const url = q.startsWith('http') ? q : 'https://' + q;
    items.unshift(`<li onclick="navigate('${url}');closeSearch()"><span class="sug-icon">🌐</span>${url}</li>`);
  } else {
    items.push(`<li onclick="navigate('https://www.google.com/search?q=${encodeURIComponent(q)}');closeSearch()"><span class="sug-icon">🔍</span>Search Google: "${q}"</li>`);
  }
  list.innerHTML = items.join('');
}

function urlKeyDown(e) {
  if (e.key === 'Enter') {
    const q = e.target.value.trim();
    let url;
    if (q.startsWith('http')) url = q;
    else if (q.includes('.') && !q.includes(' ')) url = 'https://' + q;
    else url = 'https://www.google.com/search?q=' + encodeURIComponent(q);
    navigate(url);
    closeSearch();
  }
  if (e.key === 'Escape') closeSearch();
}

function canEmbed(url) {
  try {
    const host = new URL(url).hostname;
    return EMBEDDABLE.some(e => host === e || host.endsWith('.' + e));
  } catch { return false; }
}

let currentRawUrl = '';
function navigate(url) {
  currentRawUrl = url;
  currentUrl = url;
  historyIdx++;
  history_.unshift({ url, title: new URL(url).hostname });
  if (history_.length > 50) history_.pop();
  localStorage.setItem('safariHistory', JSON.stringify(history_));

  document.getElementById('url-display').textContent = (() => { try { return new URL(url).hostname; } catch { return url; } })();
  document.getElementById('back-btn').disabled = false;
  document.getElementById('bb-back').disabled = false;
  document.getElementById('start-page').style.display = 'none';

  // Show loading bar
  const bar = document.getElementById('loading-bar');
  bar.style.width = '0';
  bar.style.display = 'block';
  setTimeout(() => bar.style.width = '60%', 50);

  if (canEmbed(url)) {
    document.getElementById('blocked-msg').style.display = 'none';
    const iframe = document.getElementById('webview');
    iframe.style.display = 'block';
    iframe.src = url;
  } else {
    // Most sites block iframes — show "open in browser" with a preview card
    setTimeout(() => {
      bar.style.width = '100%';
      setTimeout(() => { bar.style.display = 'none'; }, 400);
    }, 600);
    document.getElementById('webview').style.display = 'none';
    document.getElementById('blocked-msg').style.display = 'flex';
  }
  renderHistory();
}

function frameLoaded() {
  const bar = document.getElementById('loading-bar');
  bar.style.width = '100%';
  setTimeout(() => { bar.style.display = 'none'; bar.style.width = '0'; }, 400);
}
function frameError() { frameLoaded(); }

function openExternal() { if (currentRawUrl) window.open(currentRawUrl, '_blank'); }
function goBack() { window.history.back(); }
function goForward() { window.history.forward(); }
function reload() { const f = document.getElementById('webview'); if (f.src) f.src = f.src; }
function share() {
  if (navigator.share && currentRawUrl) navigator.share({ url: currentRawUrl, title: document.getElementById('url-display').textContent });
  else if (currentRawUrl) window.open(currentRawUrl, '_blank');
  else history.back();
}
function bookmark() {
  const b = JSON.parse(localStorage.getItem('safariBookmarks') || '[]');
  if (currentRawUrl) {
    b.unshift({ url: currentRawUrl, title: document.getElementById('url-display').textContent });
    localStorage.setItem('safariBookmarks', JSON.stringify(b));
    const t = document.createElement('div');
    t.textContent = 'Bookmarked!';
    t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#333;color:#fff;padding:12px 24px;border-radius:12px;z-index:999;font-size:15px';
    document.body.appendChild(t); setTimeout(() => t.remove(), 1500);
  }
}

renderFavorites();
renderHistory();
</script>
</body>
</html>
