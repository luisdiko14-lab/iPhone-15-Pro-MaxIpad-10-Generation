<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Pay</title>
<style>
:root {
  --bg-color: #000000;
  --card-bg: #1c1c1e;
  --text-primary: #ffffff;
  --text-secondary: #8e8e93;
  --accent: #007aff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg-color);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 12px 20px 6px;
  font-size: 13px;
  font-weight: 600;
}
.header {
  display: flex;
  align-items: center;
  padding: 8px 16px 12px;
}
.header h1 {
  font-size: 17px;
  font-weight: 600;
  flex: 1;
  text-align: center;
}
.back-btn {
  color: var(--accent);
  background: none;
  border: none;
  font-size: 17px;
  cursor: pointer;
}
.wallet-card {
  margin: 20px;
  background: linear-gradient(135deg, #1c1c1e, #3a3a3c);
  border-radius: 12px;
  padding: 20px;
  height: 200px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  position: relative;
  overflow: hidden;
}
.wallet-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  font-size: 18px;
  font-weight: 700;
  font-style: italic;
}
.card-chip {
  width: 40px;
  height: 30px;
  background: #d4af37;
  border-radius: 4px;
  margin-top: 10px;
}
.card-number {
  font-family: monospace;
  font-size: 20px;
  letter-spacing: 2px;
}
.section-title {
  padding: 0 16px 8px;
  font-size: 13px;
  color: var(--text-secondary);
  text-transform: uppercase;
  margin-top: 20px;
}
.list {
  background: var(--card-bg);
  border-top: 0.5px solid #38383a;
  border-bottom: 0.5px solid #38383a;
}
.list-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  border-bottom: 0.5px solid #38383a;
}
.add-btn {
  color: var(--accent);
  font-size: 17px;
  text-align: center;
  padding: 12px;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="status-bar">
  <button onclick="history.back()" class="back-btn">‹ Settings</button>
  <span id="st">9:41</span>
  <span>📶 🔋</span>
</div>

<div class="header">
  <h1>Wallet & Apple Pay</h1>
</div>

<div class="wallet-card">
  <div class="card-header">
    <span>Apple Card</span>
    <span></span>
  </div>
  <div class="card-chip"></div>
  <div class="card-number">•••• •••• •••• 1234</div>
</div>

<div class="section-title">Payment Cards</div>
<div class="list">
  <div class="list-item">
    <div style="background:#fff; width:40px; height:25px; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold; font-size:10px;">VISA</div>
    <div style="flex:1">Chase Sapphire</div>
    <div style="color:#8e8e93">•••• 5678</div>
  </div>
  <div class="add-btn">Add Card</div>
</div>

<script>
function tick(){const d=new Date();document.getElementById('st').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`}
tick();setInterval(tick,1000);
</script>
</body>
</html>
