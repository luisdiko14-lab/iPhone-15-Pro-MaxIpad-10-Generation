<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy & Security - Settings</title>
    <link rel="stylesheet" href="settings-page.css">
</head>
<body>
    <div class="ios-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="time">20:30</div>
            <div class="status-indicators">
                <span class="carrier">Fri 14 Aug</span>
                <div class="right-indicators">
                    <span class="signal">Verizon 📶</span>
                    <span class="wifi">📶</span>
                    <span class="battery">26% 🔋</span>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="window.location.href='home.html'">
                <span class="back-arrow">‹</span>
                <span>Settings</span>
            </button>
            <h1 class="header-title">Privacy & Security</h1>
        </div>

        <!-- Settings Groups -->
        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">Location Services</div>
                <div class="setting-value">On</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Tracking</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">App Privacy Report</div>
                <div class="chevron">›</div>
            </div>
        </div>

        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">Contacts</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Calendars</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Reminders</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Photos</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Camera</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Microphone</div>
                <div class="chevron">›</div>
            </div>
        </div>

        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">Face ID & Passcode</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Safety Check</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Lockdown Mode</div>
                <div class="setting-value">Off</div>
                <div class="chevron">›</div>
            </div>
        </div>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>
    </div>
    <script src="device-state.js"></script>
</body>
</html>
