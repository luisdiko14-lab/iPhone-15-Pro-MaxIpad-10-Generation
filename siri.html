<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siri</title>
    <link rel="stylesheet" href="siri.css">
</head>
<body>

        <button class="back-btn" onclick="window.location.href='homescreen.html'">← Back</button>

    </div>

    <script src="siri.js"></script>
</body>
</html>
