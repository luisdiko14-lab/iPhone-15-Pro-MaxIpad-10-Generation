<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;min-height:100vh;max-width:480px;margin:0 auto}
.status-bar{display:flex;justify-content:space-between;padding:12px 20px 6px;font-size:13px;font-weight:600}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 6px}
.header h1{font-size:22px;font-weight:700;color:#ff3b30}
.hbtn{background:none;border:none;color:#007aff;font-size:15px;cursor:pointer;padding:4px 8px}
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 8px}
.month-label{font-size:22px;font-weight:700}
.nav-btn{background:none;border:none;color:#007aff;font-size:22px;cursor:pointer;padding:4px 10px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px;margin-bottom:4px}
.wd{text-align:center;font-size:12px;font-weight:600;color:#8e8e93;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px;gap:2px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px;cursor:pointer;border-radius:10px;position:relative;min-height:40px}
.cal-day:hover{background:#1c1c1e}
.cal-day.other-month .day-num{color:#3a3a3c}
.cal-day .day-num{font-size:16px;font-weight:500;line-height:1.2;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal-day.today .day-num{background:#ff3b30;color:#fff;font-weight:700}
.cal-day.selected .day-num{background:#007aff;color:#fff}
.cal-day.has-event::after{content:'';width:5px;height:5px;border-radius:50%;background:#007aff;position:absolute;bottom:5px}
.cal-day.today.has-event::after{background:#fff}
.events-section{padding:12px 14px 0}
.events-hdr{font-size:16px;font-weight:700;margin-bottom:10px}
.event-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid #1c1c1e}
.event-dot{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0;min-height:44px}
.event-info .ev-time{font-size:12px;color:#8e8e93;margin-bottom:3px}
.event-info .ev-title{font-size:16px;font-weight:600}
.event-info .ev-loc{font-size:13px;color:#8e8e93;margin-top:2px}
.no-events{color:#8e8e93;font-size:14px;padding:20px 0;text-align:center}
.add-event-fab{position:fixed;bottom:30px;right:50%;transform:translateX(calc(50% - 240px + 14px));width:52px;height:52px;border-radius:50%;background:#007aff;border:none;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(0,122,255,.5);display:flex;align-items:center;justify-content:center}
@media(max-width:480px){.add-event-fab{right:14px;transform:none}}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#1c1c1e;border-radius:20px 20px 0 0;padding:20px 18px 36px;width:100%;max-width:480px}
.modal h3{font-size:20px;font-weight:700;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{font-size:13px;color:#8e8e93;margin-bottom:5px;display:block}
.form-row input,.form-row select,.form-row textarea{width:100%;background:#2c2c2e;border:none;color:#fff;padding:10px 12px;border-radius:10px;font-size:15px;outline:none;font-family:inherit;color-scheme:dark}
.form-row textarea{height:70px;resize:none}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.mbtn{flex:1;padding:13px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer}
.mbtn.cancel{background:#2c2c2e;color:#fff}
.mbtn.save{background:#007aff;color:#fff}
</style>
</head>
<body>
<div class="status-bar">
  <button onclick="history.back()" style="background:none;border:none;color:#007aff;font-size:15px;cursor:pointer">‹ Back</button>
  <span id="st">9:41</span>
  <span>📶 🔋</span>
</div>
<div class="header">
  <h1>Calendar</h1>
  <div style="display:flex;gap:4px">
    <button class="hbtn" onclick="goToToday()">Today</button>
    <button class="hbtn" onclick="openAdd()">＋</button>
  </div>
</div>
<div class="month-nav">
  <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
  <div class="month-label" id="month-label"></div>
  <button class="nav-btn" onclick="changeMonth(1)">›</button>
</div>
<div class="weekdays">
  <div class="wd">Sun</div><div class="wd">Mon</div><div class="wd">Tue</div>
  <div class="wd">Wed</div><div class="wd">Thu</div><div class="wd">Fri</div><div class="wd">Sat</div>
</div>
<div class="cal-grid" id="cal-grid"></div>
<div class="events-section">
  <div class="events-hdr" id="events-hdr">Today</div>
  <div id="events-list"></div>
</div>
<button class="add-event-fab" onclick="openAdd()">＋</button>

<div id="modal-bg" style="display:none" class="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modal-title">New Event</h3>
    <div class="form-row"><label>Title</label><input id="ev-title" placeholder="Event title" type="text"></div>
    <div class="form-row"><label>Date</label><input id="ev-date" type="date"></div>
    <div class="form-row" style="display:flex;gap:8px">
      <div style="flex:1"><label>Start</label><input id="ev-start" type="time"></div>
      <div style="flex:1"><label>End</label><input id="ev-end" type="time"></div>
    </div>
    <div class="form-row"><label>Location</label><input id="ev-loc" placeholder="Add location" type="text"></div>
    <div class="form-row"><label>Notes</label><textarea id="ev-notes" placeholder="Notes"></textarea></div>
    <div class="form-row"><label>Color</label><select id="ev-color">
      <option value="#007aff">Blue</option><option value="#ff3b30">Red</option>
      <option value="#30d158">Green</option><option value="#ff9500">Orange</option>
      <option value="#af52de">Purple</option><option value="#ff2d55">Pink</option>
    </select></div>
    <div class="modal-btns">
      <button class="mbtn cancel" onclick="closeModal()">Cancel</button>
      <button class="mbtn save" onclick="saveEvent()">Add Event</button>
    </div>
  </div>
</div>

<script>
function tick(){const d=new Date();document.getElementById('st').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`}
tick();setInterval(tick,1000);

let events=JSON.parse(localStorage.getItem('calEvents')||'[]');
// Seed events
if(!events.length){
  const today=new Date();
  const fmt=d=>d.toISOString().slice(0,10);
  const add=(n,title,start,end,loc,color)=>{const d=new Date(today);d.setDate(d.getDate()+n);events.push({id:Date.now()+n,title,date:fmt(d),start,end,loc,color,notes:''});};
  add(0,'Team standup','09:00','09:30','Zoom','#30d158');
  add(0,'Lunch with Sarah','12:00','13:00','Café Blue','#ff9500');
  add(1,'Doctor appointment','14:00','15:00','City Medical','#ff3b30');
  add(2,'Project deadline','18:00','19:00','','#007aff');
  add(3,'Dinner with family','19:00','21:00','Home','#af52de');
  add(7,'Birthday party 🎂','18:00','22:00','Alex\'s place','#ff2d55');
  localStorage.setItem('calEvents',JSON.stringify(events));
}

let nextId=parseInt(localStorage.getItem('calNextId')||'10000');
function save(){localStorage.setItem('calEvents',JSON.stringify(events));localStorage.setItem('calNextId',nextId);}

const now=new Date();
let viewYear=now.getFullYear(),viewMonth=now.getMonth();
let selectedDate=now.toISOString().slice(0,10);

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function renderCal(){
  document.getElementById('month-label').textContent=`${MONTHS[viewMonth]} ${viewYear}`;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  const first=new Date(viewYear,viewMonth,1);
  const last=new Date(viewYear,viewMonth+1,0);
  const startDay=first.getDay();
  const todayStr=now.toISOString().slice(0,10);
  const evDates=new Set(events.map(e=>e.date));

  // Prev month fill
  for(let i=0;i<startDay;i++){
    const d=new Date(viewYear,viewMonth,1-startDay+i);
    const ds=d.toISOString().slice(0,10);
    grid.innerHTML+=`<div class="cal-day other-month${evDates.has(ds)?' has-event':''}" onclick="selectDate('${ds}')"><div class="day-num">${d.getDate()}</div></div>`;
  }
  // Current month
  for(let d=1;d<=last.getDate();d++){
    const ds=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr,isSel=ds===selectedDate;
    grid.innerHTML+=`<div class="cal-day${isToday?' today':''}${isSel&&!isToday?' selected':''}${evDates.has(ds)?' has-event':''}" onclick="selectDate('${ds}')"><div class="day-num">${d}</div></div>`;
  }
  // Next month fill
  const rem=(7-((startDay+last.getDate())%7))%7;
  for(let i=1;i<=rem;i++){
    const d=new Date(viewYear,viewMonth+1,i);
    const ds=d.toISOString().slice(0,10);
    grid.innerHTML+=`<div class="cal-day other-month${evDates.has(ds)?' has-event':''}" onclick="selectDate('${ds}')"><div class="day-num">${i}</div></div>`;
  }
  renderEvents();
}

function selectDate(ds){
  selectedDate=ds;renderCal();
}

function renderEvents(){
  const dayEvs=events.filter(e=>e.date===selectedDate).sort((a,b)=>a.start.localeCompare(b.start));
  const todayStr=now.toISOString().slice(0,10);
  const label=selectedDate===todayStr?'Today':new Date(selectedDate+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('events-hdr').textContent=label;
  if(!dayEvs.length){document.getElementById('events-list').innerHTML='<div class="no-events">No events</div>';return;}
  document.getElementById('events-list').innerHTML=dayEvs.map(e=>`<div class="event-item">
    <div class="event-dot" style="background:${e.color}"></div>
    <div class="event-info">
      <div class="ev-time">${e.start||'All day'}${e.end?'–'+e.end:''}</div>
      <div class="ev-title">${e.title}</div>
      ${e.loc?`<div class="ev-loc">📍 ${e.loc}</div>`:''}
    </div>
    <button onclick="deleteEvent(${e.id})" style="background:none;border:none;color:#8e8e93;font-size:16px;cursor:pointer;margin-left:auto;padding:4px">×</button>
  </div>`).join('');
}

function changeMonth(d){viewMonth+=d;if(viewMonth>11){viewMonth=0;viewYear++;}if(viewMonth<0){viewMonth=11;viewYear--;}renderCal();}
function goToToday(){viewYear=now.getFullYear();viewMonth=now.getMonth();selectedDate=now.toISOString().slice(0,10);renderCal();}
function deleteEvent(id){events=events.filter(e=>e.id!==id);save();renderEvents();}

function openAdd(){
  document.getElementById('ev-title').value='';
  document.getElementById('ev-date').value=selectedDate;
  document.getElementById('ev-start').value='09:00';
  document.getElementById('ev-end').value='10:00';
  document.getElementById('ev-loc').value='';
  document.getElementById('ev-notes').value='';
  document.getElementById('modal-bg').style.display='flex';
  setTimeout(()=>document.getElementById('ev-title').focus(),100);
}
function closeModal(){document.getElementById('modal-bg').style.display='none';}
function saveEvent(){
  const title=document.getElementById('ev-title').value.trim();
  if(!title)return;
  events.push({id:nextId++,title,date:document.getElementById('ev-date').value||selectedDate,start:document.getElementById('ev-start').value,end:document.getElementById('ev-end').value,loc:document.getElementById('ev-loc').value.trim(),notes:document.getElementById('ev-notes').value.trim(),color:document.getElementById('ev-color').value});
  save();closeModal();
  selectedDate=document.getElementById('ev-date').value||selectedDate;
  renderCal();
}
renderCal();
</script>
</body>
</html>
