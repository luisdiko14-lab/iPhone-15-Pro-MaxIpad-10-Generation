<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Profile</title>
    <style>
        :root {
            --discord-blue: #5865F2;
            --discord-dark: #313338;
            --discord-black: #1E1F22;
            --text-primary: #F2F3F5;
            --text-secondary: #B5BAC1;
        }
        body {
            font-family: 'gg sans', 'Noto Sans', sans-serif;
            background-color: var(--discord-black);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background-color: var(--discord-dark);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.2);
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--discord-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .user-info h1 { margin: 0; font-size: 24px; }
        .user-info p { margin: 5px 0 0; color: var(--text-secondary); }
        
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .section {
            background-color: var(--discord-dark);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .section-title {
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .item:last-child { border-bottom: none; }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            background-color: var(--discord-black);
        }
        .btn {
            background-color: var(--discord-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn:hover { background-color: #4752C4; }

        #chat-ui { display: none; flex-direction: column; height: 100%; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { display: flex; gap: 10px; }
        .msg-content { background: var(--discord-dark); padding: 10px; border-radius: 8px; max-width: 80%; }
        .input-area { padding: 20px; background: var(--discord-dark); display: flex; gap: 10px; }
        input { flex: 1; background: #383A40; border: none; padding: 10px; color: white; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="profile-ui">
        <div class="header">
            <div class="avatar" id="user-avatar">?</div>
            <div class="user-info">
                <h1 id="username">Loading...</h1>
                <p id="email">Loading email...</p>
            </div>
        </div>
        <div class="content">
            <div class="section">
                <div class="section-title">Connections</div>
                <div id="connections-list">Loading connections...</div>
            </div>
            <div class="section">
                <div class="section-title">Guilds (Servers)</div>
                <div id="guilds-list">Loading guilds...</div>
            </div>
        </div>
        <div class="nav-buttons">
            <button class="btn" onclick="showChat()">Open Bot Chat</button>
            <button class="btn" style="background: #4E5058;" onclick="window.location.href='discord_login.html'">Logout / Re-login</button>
            <button class="btn" onclick="window.location.href='homescreen.html'">Back to Home</button>
        </div>
    </div>

    <div id="chat-ui">
        <div class="header">
            <div class="avatar" style="width: 40px; height: 40px; font-size: 16px;">🤖</div>
            <div class="user-info">
                <h1 style="font-size: 18px;">Fake Bot</h1>
                <p style="font-size: 12px;">Always online</p>
            </div>
        </div>
        <div class="messages" id="messages">
            <div class="message">
                <div class="msg-content">Hello! I'm a fake bot. How can I help you today?</div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Message #fake-bot" onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">Send</button>
            <button class="btn" style="background: #4E5058;" onclick="showProfile()">Back</button>
        </div>
    </div>

    <script>
        function showChat() {
            document.getElementById('profile-ui').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'flex';
        }
        function showProfile() {
            document.getElementById('profile-ui').style.display = 'flex';
            document.getElementById('chat-ui').style.display = 'none';
        }
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const messages = document.getElementById('messages');
            
            // User message
            const userMsg = document.createElement('div');
            userMsg.className = 'message';
            userMsg.style.alignSelf = 'flex-end';
            userMsg.innerHTML = `<div class="msg-content" style="background: var(--discord-blue)">${text}</div>`;
            messages.appendChild(userMsg);
            
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            // Bot reply
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message';
                botMsg.innerHTML = `<div class="msg-content">That's interesting! I'm just a simple bot, but I heard you said: "${text}"</div>`;
                messages.appendChild(botMsg);
                messages.scrollTop = messages.scrollHeight;
            }, 1000);
        }

        // Real data fetch from our backend.
        // The access token now lives in a server-side session cookie — we never
        // see it in the browser. We just call /api/me and the server uses the
        // cookie to look up the token.
        async function loadDiscordData() {
            // Strip any legacy ?access_token=… from the URL so it never sits
            // in browser history or referer headers.
            if (window.location.search.includes('access_token')) {
                history.replaceState({}, '', window.location.pathname);
            }

            try {
                const response = await fetch('/api/me', { credentials: 'same-origin' });
                if (response.status === 401) {
                    document.getElementById('username').innerText = 'Not signed in';
                    document.getElementById('email').innerText = 'Tap "Login with Discord" to sign in.';
                    return;
                }
                if (!response.ok) {
                    document.getElementById('username').innerText = 'Error loading profile';
                    return;
                }
                const data = await response.json();
                const user = data.user;
                if (!user) {
                    document.getElementById('username').innerText = 'Profile unavailable';
                    return;
                }

                const tag = user.discriminator && user.discriminator !== '0'
                    ? `${user.username}#${user.discriminator}`
                    : `@${user.username}`;
                document.getElementById('username').innerText = tag;
                document.getElementById('email').innerText = user.email || 'No email shared';
                document.getElementById('user-avatar').innerText = user.username.substring(0, 2).toUpperCase();

                if (user.avatar) {
                    const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
                    document.getElementById('user-avatar').style.backgroundImage = `url(${avatarUrl})`;
                    document.getElementById('user-avatar').style.backgroundSize = 'cover';
                    document.getElementById('user-avatar').innerText = '';
                }

                const conns = Array.isArray(data.connections) ? data.connections : [];
                document.getElementById('connections-list').innerHTML = conns.length
                    ? conns.map(c => `<div class="item">🔗 ${c.name} (${c.type})</div>`).join('')
                    : '<div class="item" style="opacity:0.6">No connections shared</div>';

                const guilds = Array.isArray(data.guilds) ? data.guilds : [];
                document.getElementById('guilds-list').innerHTML = guilds.length
                    ? guilds.map(g => `<div class="item">📁 ${g.name}</div>`).join('')
                    : '<div class="item" style="opacity:0.6">No servers</div>';
            } catch (error) {
                console.error('Error fetching Discord data:', error);
                document.getElementById('username').innerText = 'Error loading profile';
            }
        }

        loadDiscordData();
    </script>
</body>
</html>
