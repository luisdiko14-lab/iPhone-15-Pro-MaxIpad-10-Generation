<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Profile</title>
    <style>
        :root {
            --discord-blue: #5865F2;
            --discord-blue-hover: #4752C4;
            --discord-dark: #313338;
            --discord-darker: #2b2d31;
            --discord-black: #1E1F22;
            --text-primary: #F2F3F5;
            --text-secondary: #B5BAC1;
            --text-muted: #80848e;
            --green: #23a55a;
            --yellow: #f0b232;
            --red: #f23f43;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'gg sans', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--discord-black);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ---------- Profile card (Discord user-popout style) ---------- */
        .profile-card {
            background-color: var(--discord-darker);
            border-radius: 0;
            overflow: hidden;
            position: relative;
        }
        .banner {
            height: 110px;
            background: linear-gradient(135deg, var(--discord-blue), #7289da);
            position: relative;
        }
        .banner.has-image { background-size: cover; background-position: center; }
        .avatar-wrap {
            position: absolute;
            top: 60px;
            left: 20px;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 6px solid var(--discord-darker);
            background: var(--discord-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: white;
            background-size: cover;
            background-position: center;
        }
        .status-dot {
            position: absolute;
            bottom: 4px; right: 4px;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--green);
            border: 4px solid var(--discord-darker);
        }
        .profile-body {
            padding: 60px 20px 18px;
        }
        .profile-name {
            font-size: 22px; font-weight: 700; margin: 0;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .badge-pill {
            background: var(--discord-blue);
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .profile-handle { color: var(--text-secondary); font-size: 14px; margin: 2px 0 12px; }
        .profile-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 14px;
            background: var(--discord-black);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
        }
        .meta-row { display: flex; flex-direction: column; }
        .meta-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .meta-value { color: var(--text-primary); margin-top: 2px; word-break: break-all; }
        .meta-value.copy { cursor: pointer; }
        .meta-value.copy:hover { color: var(--discord-blue); }

        /* ---------- Sections ---------- */
        .content {
            padding: 16px 20px 24px;
            flex: 1;
        }
        .section {
            background-color: var(--discord-darker);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 14px;
        }
        .section-title {
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            margin: 0 0 10px;
            letter-spacing: 0.5px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .count-pill {
            background: var(--discord-black);
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }
        .item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 14px;
        }
        .item:last-child { border-bottom: none; }
        .guild-icon {
            width: 32px; height: 32px;
            border-radius: 10px;
            background: var(--discord-blue);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: white;
            flex-shrink: 0;
            background-size: cover; background-position: center;
        }
        .item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item .tag {
            font-size: 10px;
            background: var(--discord-black);
            color: var(--text-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .empty { color: var(--text-muted); font-style: italic; padding: 6px 0; font-size: 13px; }

        /* ---------- Bottom action bar ---------- */
        .nav-buttons {
            display: flex;
            gap: 8px;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            background-color: var(--discord-darker);
            border-top: 1px solid rgba(0,0,0,0.3);
            position: sticky;
            bottom: 0;
        }
        .btn {
            background-color: var(--discord-blue);
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            font-family: inherit;
            flex: 1;
            transition: background-color 0.15s;
        }
        .btn:hover:not(:disabled) { background-color: var(--discord-blue-hover); }
        .btn.secondary { background-color: #4E5058; }
        .btn.secondary:hover { background-color: #6d6f78; }
        .btn.danger { background-color: var(--red); }

        /* ---------- Chat UI ---------- */
        #chat-ui { display: none; flex-direction: column; height: 100vh; background: var(--discord-dark); }
        .chat-header {
            background-color: var(--discord-darker);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(0,0,0,0.3);
        }
        .chat-header .avatar-mini {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, #5865F2, #ed4245);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .chat-header h2 { margin: 0; font-size: 15px; font-weight: 600; }
        .chat-header .sub { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
        .chat-header .sub::before {
            content: ''; display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; background: var(--green); margin-right: 2px;
        }
        .messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message { display: flex; gap: 10px; max-width: 100%; }
        .message.from-user { flex-direction: row-reverse; }
        .msg-content {
            background: var(--discord-darker);
            padding: 10px 14px;
            border-radius: 14px;
            max-width: 75%;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.from-user .msg-content {
            background: var(--discord-blue);
        }
        .typing {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 12px 16px;
        }
        .typing span {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--text-secondary);
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.15s; }
        .typing span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-5px); opacity: 1; }
        }
        .input-area {
            padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
            background: var(--discord-darker);
            display: flex;
            gap: 8px;
            border-top: 1px solid rgba(0,0,0,0.3);
        }
        input.chat-input {
            flex: 1;
            background: #383A40;
            border: none;
            padding: 12px 14px;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        input.chat-input:focus { outline: 2px solid var(--discord-blue); outline-offset: -1px; }

        /* ---------- Loading state ---------- */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 4px;
            color: transparent;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .toast {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--green); color: white;
            padding: 10px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 600;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    </style>
</head>
<body>
    <div id="profile-ui">
        <div class="profile-card">
            <div class="banner" id="banner"></div>
            <div class="avatar-wrap" id="user-avatar">
                ?
                <span class="status-dot"></span>
            </div>
            <div class="profile-body">
                <h1 class="profile-name" id="profile-name">
                    <span class="skeleton" style="width: 140px;">Loading…</span>
                </h1>
                <div class="profile-handle" id="profile-handle">
                    <span class="skeleton" style="width: 100px; display:inline-block;">@…</span>
                </div>
                <div class="profile-meta">
                    <div class="meta-row">
                        <span class="meta-label">Email</span>
                        <span class="meta-value" id="meta-email">—</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">Locale</span>
                        <span class="meta-value" id="meta-locale">—</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">User ID</span>
                        <span class="meta-value copy" id="meta-id" title="Tap to copy">—</span>
                    </div>
                    <div class="meta-row">
                        <span class="meta-label">Joined Discord</span>
                        <span class="meta-value" id="meta-created">—</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="section" id="openid-section" style="display:none;">
                <div class="section-title">
                    <span>OpenID Identity</span>
                    <span class="count-pill" id="openid-iss">—</span>
                </div>
                <div id="openid-list"></div>
            </div>
            <div class="section">
                <div class="section-title">
                    <span>Connections</span>
                    <span class="count-pill" id="conn-count">0</span>
                </div>
                <div id="connections-list"><div class="empty">Loading…</div></div>
            </div>
            <div class="section">
                <div class="section-title">
                    <span>Servers</span>
                    <span class="count-pill" id="guild-count">0</span>
                </div>
                <div id="guilds-list"><div class="empty">Loading…</div></div>
            </div>
        </div>

        <div class="nav-buttons">
            <button class="btn" onclick="showChat()">💬 Chat with Pixel</button>
            <button class="btn secondary" onclick="window.location.href='homescreen.html'">Home</button>
            <button class="btn danger" id="logout-btn">Log out</button>
        </div>
    </div>

    <div id="chat-ui">
        <div class="chat-header">
            <div class="avatar-mini">🤖</div>
            <div>
                <h2>Pixel</h2>
                <div class="sub">Online · AI-powered bot</div>
            </div>
        </div>
        <div class="messages" id="messages">
            <div class="message">
                <div class="msg-content">Hey there! 👋 I'm Pixel — ask me anything.</div>
            </div>
        </div>
        <div class="input-area">
            <input class="chat-input" type="text" id="msg-input" placeholder="Message @Pixel">
            <button class="btn" style="flex: 0 0 auto;" id="send-btn">Send</button>
            <button class="btn secondary" style="flex: 0 0 auto;" onclick="showProfile()">Back</button>
        </div>
    </div>

    <div class="toast" id="toast">Copied!</div>

    <script>
        // ===== Navigation =====
        function showChat() {
            document.getElementById('profile-ui').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'flex';
            setTimeout(() => document.getElementById('msg-input').focus(), 50);
        }
        function showProfile() {
            document.getElementById('profile-ui').style.display = 'block';
            document.getElementById('chat-ui').style.display = 'none';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1400);
        }

        // ===== Discord snowflake → date =====
        // Discord snowflakes encode the creation timestamp in the upper bits.
        // Epoch is 2015-01-01.
        function snowflakeToDate(id) {
            try {
                const DISCORD_EPOCH = 1420070400000n;
                const ms = (BigInt(id) >> 22n) + DISCORD_EPOCH;
                return new Date(Number(ms));
            } catch { return null; }
        }

        // Default Discord avatar color from discriminator (or new system: id%6)
        function defaultAvatarUrl(user) {
            const idx = user.discriminator && user.discriminator !== '0'
                ? Number(user.discriminator) % 5
                : Number((BigInt(user.id) >> 22n) % 6n);
            return `https://cdn.discordapp.com/embed/avatars/${idx}.png`;
        }

        // Convert int color (e.g. 0x5865F2) → CSS hex
        function intToHex(n) {
            return '#' + n.toString(16).padStart(6, '0');
        }

        // ===== Render OpenID Connect claims =====
        // When the `openid` scope is requested, Discord returns an id_token
        // (JWT). The server decodes it and forwards the claims here.
        // Discord's id_token typically contains: iss, sub, aud, exp, iat,
        // email, email_verified, preferred_username, picture, locale.
        // (No standard "description"/"bio" field — Discord doesn't expose
        // user bios via OAuth, so we display whatever Discord actually sends.)
        function renderOpenId(claims) {
            if (!claims || typeof claims !== 'object') return;
            const section = document.getElementById('openid-section');
            const list = document.getElementById('openid-list');
            const issEl = document.getElementById('openid-iss');

            // Friendly issuer label
            const iss = claims.iss || claims.issuer || '';
            issEl.textContent = iss
                ? iss.replace(/^https?:\/\//, '').split('/')[0]
                : 'verified';

            // Friendly labels for known claims; everything else falls through.
            const labels = {
                preferred_username: 'Username',
                email: 'Email',
                email_verified: 'Email verified',
                picture: 'Picture',
                locale: 'Locale',
                sub: 'Subject (User ID)',
                description: 'Description',
                bio: 'Bio',
                profile: 'Profile',
                website: 'Website',
                given_name: 'Given name',
                family_name: 'Family name',
                name: 'Name',
                updated_at: 'Last updated',
            };
            // Skip purely-mechanical JWT plumbing
            const skip = new Set(['iss', 'aud', 'exp', 'iat', 'nbf', 'jti', 'azp']);

            const rows = [];
            for (const [k, v] of Object.entries(claims)) {
                if (skip.has(k)) continue;
                const label = labels[k] || k;
                let display;
                if (typeof v === 'boolean') {
                    display = v ? '✓ Yes' : '✗ No';
                } else if (k === 'picture' && typeof v === 'string') {
                    display = `<a href="${escapeHtml(v)}" target="_blank" style="color: var(--discord-blue); word-break: break-all;">${escapeHtml(v)}</a>`;
                } else if (k === 'updated_at' && (typeof v === 'number' || typeof v === 'string')) {
                    const d = new Date(typeof v === 'number' ? v * 1000 : v);
                    display = isNaN(d) ? escapeHtml(String(v)) : d.toLocaleString();
                } else if (typeof v === 'object') {
                    display = `<code style="font-size: 11px;">${escapeHtml(JSON.stringify(v))}</code>`;
                } else {
                    display = escapeHtml(String(v));
                }
                rows.push(`
                    <div class="item" style="align-items: flex-start;">
                        <div style="flex: 0 0 110px; font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; padding-top: 2px;">
                            ${escapeHtml(label)}
                        </div>
                        <div class="grow" style="white-space: normal; word-break: break-word; font-size: 13px;">${display}</div>
                    </div>
                `);
            }
            if (!rows.length) {
                list.innerHTML = '<div class="empty">No claims returned</div>';
            } else {
                list.innerHTML = rows.join('');
            }
            section.style.display = 'block';
        }

        // ===== Load profile =====
        async function loadDiscordData() {
            // Strip any legacy ?access_token=… from the URL (legacy compat).
            if (window.location.search.includes('access_token')) {
                history.replaceState({}, '', window.location.pathname);
            }

            try {
                const response = await fetch('/api/me', { credentials: 'same-origin' });
                if (response.status === 401) {
                    window.location.href = 'discord_login.html';
                    return;
                }
                if (!response.ok) {
                    document.getElementById('profile-name').textContent = 'Error loading profile';
                    return;
                }
                const data = await response.json();
                const user = data.user;
                if (!user) {
                    document.getElementById('profile-name').textContent = 'Profile unavailable';
                    return;
                }

                // ---- Name + handle ----
                const displayName = user.global_name || user.username;
                const nameEl = document.getElementById('profile-name');
                nameEl.innerHTML = '';
                nameEl.appendChild(document.createTextNode(displayName));
                if (user.verified) {
                    const badge = document.createElement('span');
                    badge.className = 'badge-pill';
                    badge.textContent = '✓ Verified';
                    nameEl.appendChild(badge);
                }
                document.getElementById('profile-handle').textContent =
                    user.discriminator && user.discriminator !== '0'
                        ? `${user.username}#${user.discriminator}`
                        : `@${user.username}`;

                // ---- Avatar ----
                const avatarEl = document.getElementById('user-avatar');
                avatarEl.firstChild.textContent = displayName.substring(0, 2).toUpperCase();
                const avatarUrl = user.avatar
                    ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=128`
                    : defaultAvatarUrl(user);
                avatarEl.style.backgroundImage = `url(${avatarUrl})`;
                avatarEl.firstChild.textContent = '';

                // ---- Banner (color or image) ----
                const banner = document.getElementById('banner');
                if (user.banner) {
                    banner.classList.add('has-image');
                    banner.style.backgroundImage =
                        `url(https://cdn.discordapp.com/banners/${user.id}/${user.banner}.${user.banner.startsWith('a_') ? 'gif' : 'png'}?size=600)`;
                } else if (typeof user.accent_color === 'number') {
                    banner.style.background = intToHex(user.accent_color);
                }

                // ---- Meta ----
                document.getElementById('meta-email').textContent = user.email || 'Not shared';
                document.getElementById('meta-locale').textContent = user.locale || 'Unknown';
                const idEl = document.getElementById('meta-id');
                idEl.textContent = user.id;
                idEl.onclick = () => {
                    navigator.clipboard?.writeText(user.id);
                    showToast('User ID copied!');
                };
                const created = snowflakeToDate(user.id);
                document.getElementById('meta-created').textContent = created
                    ? created.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
                    : 'Unknown';

                // ---- Connections ----
                const conns = Array.isArray(data.connections) ? data.connections : [];
                document.getElementById('conn-count').textContent = conns.length;
                const connEl = document.getElementById('connections-list');
                if (conns.length) {
                    connEl.innerHTML = conns.map(c => `
                        <div class="item">
                            <div class="guild-icon" style="background: #4E5058; font-size: 16px;">🔗</div>
                            <div class="grow">
                                <div>${escapeHtml(c.name)}</div>
                                <div style="font-size: 11px; color: var(--text-muted);">${escapeHtml(c.type)}</div>
                            </div>
                            ${c.verified ? '<span class="tag" style="background: rgba(35,165,90,0.2); color: var(--green);">verified</span>' : ''}
                        </div>
                    `).join('');
                } else {
                    connEl.innerHTML = '<div class="empty">No connected accounts</div>';
                }

                // ---- Guilds (sorted, with per-guild member info) ----
                const guilds = Array.isArray(data.guilds) ? [...data.guilds] : [];
                guilds.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                document.getElementById('guild-count').textContent = guilds.length;
                const guildEl = document.getElementById('guilds-list');
                if (guilds.length) {
                    guildEl.innerHTML = guilds.map(g => {
                        const initials = (g.name || '?').split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
                        const iconStyle = g.icon
                            ? `background-image: url(https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=64);`
                            : '';
                        const m = g.member || null;
                        const nick = m && m.nick ? m.nick : null;
                        const roleCount = m && Array.isArray(m.roles) ? m.roles.length : 0;
                        const joined = m && m.joined_at ? new Date(m.joined_at) : null;
                        const joinedStr = joined && !isNaN(joined)
                            ? joined.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
                            : null;
                        const subBits = [];
                        if (nick) subBits.push(`as <strong>${escapeHtml(nick)}</strong>`);
                        if (roleCount) subBits.push(`${roleCount} role${roleCount === 1 ? '' : 's'}`);
                        if (joinedStr) subBits.push(`joined ${joinedStr}`);
                        if (m && m.premium_since) subBits.push('💎 boosting');
                        const subline = subBits.length
                            ? `<div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${subBits.join(' · ')}</div>`
                            : '';
                        return `
                            <div class="item" style="align-items: flex-start;">
                                <div class="guild-icon" style="${iconStyle}">${g.icon ? '' : escapeHtml(initials)}</div>
                                <div class="grow" style="white-space: normal;">
                                    <div>${escapeHtml(g.name || 'Unnamed server')}</div>
                                    ${subline}
                                </div>
                                ${g.owner ? '<span class="tag" style="background: rgba(240,178,50,0.18); color: var(--yellow);">owner</span>' : ''}
                            </div>
                        `;
                    }).join('');
                } else {
                    guildEl.innerHTML = '<div class="empty">Not in any servers</div>';
                }

                // ---- OpenID claims (when openid scope present) ----
                renderOpenId(data.openid);

            } catch (error) {
                console.error('Error fetching Discord data:', error);
                document.getElementById('profile-name').textContent = 'Network error';
            }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        // ===== Logout =====
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
            window.location.href = 'discord_login.html';
        });

        // ===== Bot chat (Groq-powered with graceful fallback) =====
        const chatHistory = [];

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const messages = document.getElementById('messages');
            const userMsg = document.createElement('div');
            userMsg.className = 'message from-user';
            userMsg.innerHTML = `<div class="msg-content"></div>`;
            userMsg.querySelector('.msg-content').textContent = text;
            messages.appendChild(userMsg);

            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            // Typing indicator
            const typing = document.createElement('div');
            typing.className = 'message';
            typing.innerHTML = `<div class="msg-content typing"><span></span><span></span><span></span></div>`;
            messages.appendChild(typing);
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch('/api/discord/bot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory.slice(-6) })
                });
                const data = await res.json();
                const reply = data.reply || "Hmm, I'm not sure what to say.";
                typing.remove();

                const botMsg = document.createElement('div');
                botMsg.className = 'message';
                botMsg.innerHTML = `<div class="msg-content"></div>`;
                botMsg.querySelector('.msg-content').textContent = reply;
                messages.appendChild(botMsg);
                messages.scrollTop = messages.scrollHeight;

                chatHistory.push({ user: text, bot: reply });
            } catch (err) {
                typing.remove();
                const botMsg = document.createElement('div');
                botMsg.className = 'message';
                botMsg.innerHTML = `<div class="msg-content"></div>`;
                botMsg.querySelector('.msg-content').textContent = "(I'm having trouble connecting — try again?)";
                messages.appendChild(botMsg);
            }
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('msg-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        loadDiscordData();
    </script>
</body>
</html>
