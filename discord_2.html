<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Profile</title>
    <style>
        :root {
            --discord-blue: #5865F2;
            --discord-dark: #313338;
            --discord-black: #1E1F22;
            --text-primary: #F2F3F5;
            --text-secondary: #B5BAC1;
        }
        body {
            font-family: 'gg sans', 'Noto Sans', sans-serif;
            background-color: var(--discord-black);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background-color: var(--discord-dark);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.2);
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--discord-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .user-info h1 { margin: 0; font-size: 24px; }
        .user-info p { margin: 5px 0 0; color: var(--text-secondary); }
        
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .section {
            background-color: var(--discord-dark);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .section-title {
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .item:last-child { border-bottom: none; }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            background-color: var(--discord-black);
        }
        .btn {
            background-color: var(--discord-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn:hover { background-color: #4752C4; }

        #chat-ui { display: none; flex-direction: column; height: 100%; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { display: flex; gap: 10px; }
        .msg-content { background: var(--discord-dark); padding: 10px; border-radius: 8px; max-width: 80%; }
        .input-area { padding: 20px; background: var(--discord-dark); display: flex; gap: 10px; }
        input { flex: 1; background: #383A40; border: none; padding: 10px; color: white; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="profile-ui">
        <div class="header">
            <div class="avatar" id="user-avatar">?</div>
            <div class="user-info">
                <h1 id="username">Loading...</h1>
                <p id="email">Loading email...</p>
            </div>
        </div>
        <div class="content">
            <div class="section">
                <div class="section-title">Connections</div>
                <div id="connections-list">Loading connections...</div>
            </div>
            <div class="section">
                <div class="section-title">Guilds (Servers)</div>
                <div id="guilds-list">Loading guilds...</div>
            </div>
        </div>
        <div class="nav-buttons">
            <button class="btn" onclick="showChat()">Open Bot Chat</button>
            <button class="btn" style="background: #4E5058;" onclick="window.location.href='discord_login.html'">Logout / Re-login</button>
            <button class="btn" onclick="window.location.href='homescreen.html'">Back to Home</button>
        </div>
    </div>

    <div id="chat-ui">
        <div class="header">
            <div class="avatar" style="width: 40px; height: 40px; font-size: 16px;">🤖</div>
            <div class="user-info">
                <h1 style="font-size: 18px;">Fake Bot</h1>
                <p style="font-size: 12px;">Always online</p>
            </div>
        </div>
        <div class="messages" id="messages">
            <div class="message">
                <div class="msg-content">Hello! I'm a fake bot. How can I help you today?</div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Message #fake-bot" onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">Send</button>
            <button class="btn" style="background: #4E5058;" onclick="showProfile()">Back</button>
        </div>
    </div>

    <script>
        function showChat() {
            document.getElementById('profile-ui').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'flex';
        }
        function showProfile() {
            document.getElementById('profile-ui').style.display = 'flex';
            document.getElementById('chat-ui').style.display = 'none';
        }
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const messages = document.getElementById('messages');
            
            // User message
            const userMsg = document.createElement('div');
            userMsg.className = 'message';
            userMsg.style.alignSelf = 'flex-end';
            userMsg.innerHTML = `<div class="msg-content" style="background: var(--discord-blue)">${text}</div>`;
            messages.appendChild(userMsg);
            
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            // Bot reply
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message';
                botMsg.innerHTML = `<div class="msg-content">That's interesting! I'm just a simple bot, but I heard you said: "${text}"</div>`;
                messages.appendChild(botMsg);
                messages.scrollTop = messages.scrollHeight;
            }, 1000);
        }

        // Mock data fetch for demo purposes
        async function loadDiscordData() {
            // In a real app, these would come from the Discord API integration
            document.getElementById('username').innerText = 'DiscordUser#1234';
            document.getElementById('email').innerText = 'user@example.com';
            document.getElementById('user-avatar').innerText = 'DU';
            
            const connections = ['YouTube', 'GitHub', 'Spotify', 'Steam'];
            document.getElementById('connections-list').innerHTML = connections.map(c => `<div class="item">🔗 ${c}</div>`).join('');
            
            const guilds = ['Replit Creators', 'Javascript Mastery', 'Gaming Hub', 'Study Group'];
            document.getElementById('guilds-list').innerHTML = guilds.map(g => `<div class="item">📁 ${g}</div>`).join('');
        }

        loadDiscordData();
    </script>
</body>
</html>
