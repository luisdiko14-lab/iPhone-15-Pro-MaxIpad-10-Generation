<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            padding: 60px 20px 20px;
            font-size: 34px;
            font-weight: 700;
        }
        .now-playing {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .album-art {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #ff2d55, #ff3b30);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }
        .track-info {
            text-align: center;
            margin-bottom: 40px;
        }
        .title { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .artist { color: #ff2d55; font-size: 18px; }
        .controls {
            display: flex;
            gap: 60px;
            font-size: 40px;
            align-items: center;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff2d55;
            text-decoration: none;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <script>
        const callback = Math.random().toString(36).substring(2, 10);
        document.write(`<a href="homescreen.html?redirect_from=music&callback=${callback}" class="back-btn">‹ Back</a>`);
    </script>
    <div class="header">Now Playing</div>
    <div class="now-playing">
        <div class="album-art">🎵</div>
        <div class="track-info">
            <div class="title">VMware Fusion Anthem</div>
            <div class="artist">The Virtualizers</div>
        </div>
        <div class="controls">
            <span>⏮️</span>
            <span>▶️</span>
            <span>⏭️</span>
        </div>
    </div>
</body>
</html>
