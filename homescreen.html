<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Home Screen</title>
    <link rel="stylesheet" href="homescreen.css">
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="time" id="time">14:30</div>
        <div class="status-indicators">
            <span class="carrier">Thu 14 Aug</span>
            <div class="right-indicators">
                <span class="signal">📶</span>
                <span class="wifi">📶</span>
                <span class="battery">26% 🔋</span>
            </div>
        </div>
    </div>

    <div class="homescreen">
        <!-- First Row -->
        <div class="app" id="phone-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #34c759, #4dd65a);">
                📞
            </div>
            <span>Phone</span>
        </div>
        <div class="app" id="messages-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #339cff);">
                💬
            </div>
            <span>Messages</span>
        </div>
        <div class="app" id="camera-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #8e8e93, #adadad);">
                📷
            </div>
            <span>Camera</span>
        </div>
        <div class="app" id="photos-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #339cff);">
                🖼️
            </div>
            <span>Photos</span>
        </div>

        <!-- Second Row -->
        <div class="app" id="settings-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #8e8e93, #adadad);">
                ⚙️
            </div>
            <span>Settings</span>
        </div>
        <div class="app" id="app-store-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #339cff);">
                🏪
            </div>
            <span>App Store</span>
        </div>
        <div class="app" id="safari-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #339cff);">
                🌐
            </div>
            <span>Safari</span>
        </div>
        <div class="app" id="mail-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #339cff);">
                ✉️
            </div>
            <span>Mail</span>
        </div>

        <!-- Third Row -->
        <div class="app" id="music-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #ff2d92, #ff6bb3);">
                🎵
            </div>
            <span>Music</span>
        </div>
        <div class="app" id="notes-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #ffcc02, #ffd60a);">
                📝
            </div>
            <span>Notes</span>
        </div>
        <div class="app" id="calculator-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #1c1c1e, #2c2c2e);">
                🧮
            </div>
            <span>Calculator</span>
        </div>
        <div class="app" id="weather-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #339cff);">
                ⛅
            </div>
            <span>Weather</span>
        </div>

        <!-- Fourth Row -->
        <div class="app" id="clock-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #1c1c1e, #2c2c2e);">
                ⏰
            </div>
            <span>Clock</span>
        </div>
        <div class="app" id="maps-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #34c759, #4dd65a);">
                🗺️
            </div>
            <span>Maps</span>
        </div>
        <div class="app" id="facetime-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #34c759, #4dd65a);">
                📹
            </div>
            <span>FaceTime</span>
        </div>
        <div class="app" id="wallet-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #1c1c1e, #2c2c2e);">
                💳
            </div>
            <span>Wallet</span>
        </div>

        <!-- Fifth Row with authentication and VPN -->
        <div class="app" id="auth-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #339cff);">
                🔐
            </div>
            <span>Sign In</span>
        </div>
        <div class="app" id="vpn-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #ff9500, #ffad33);">
                🛡️
            </div>
            <span>VPN</span>
        </div>
        <div class="app" id="health-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #ff3b30, #ff6961);">
                ❤️
            </div>
            <span>Health</span>
        </div>
        <div class="app" id="find-my-app">
            <div class="app-icon" style="background: linear-gradient(135deg, #34c759, #4dd65a);">
                📍
            </div>
            <span>Find My</span>
        </div>
    </div>

    <!-- Dock -->
    <div class="dock">
        <div class="app" id="dock-phone">
            <div class="app-icon" style="background: linear-gradient(135deg, #34c759, #4dd65a);">
                📞
            </div>
        </div>
        <div class="app" id="dock-safari">
            <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #339cff);">
                🌐
            </div>
        </div>
        <div class="app" id="dock-messages">
            <div class="app-icon" style="background: linear-gradient(135deg, #007aff, #339cff);">
                💬
            </div>
        </div>
        <div class="app" id="dock-music">
            <div class="app-icon" style="background: linear-gradient(135deg, #ff2d92, #ff6bb3);">
                🎵
            </div>
        </div>
    </div>

    <!-- App Switcher Overlay -->
    <div class="app-switcher" id="appSwitcher">
        <div class="app-switcher-header">
            <h3>Recently Used</h3>
        </div>
        <div class="recent-apps" id="recentApps"></div>
        <div class="app-switcher-hint">Swipe up to close</div>
    </div>

    <!-- Home Indicator Swipe Area -->
    <div class="home-indicator-area" id="homeIndicatorArea"></div>

    <script src="homescreen.js"></script>
</body>
</html>
