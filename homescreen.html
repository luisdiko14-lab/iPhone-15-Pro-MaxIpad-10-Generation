<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        </div>
        <div class="app">
            <img src="https://cdn.discordapp.com/attachments/1404009284760506398/1405943131370688562/Mail_logo.jpeg" alt="Mail">

        </div>
        <div class="app">
            <img src="https://cdn.discordapp.com/attachments/1404009284760506398/1405943436229480549/Settings_logo.jpeg" alt="Settings">
