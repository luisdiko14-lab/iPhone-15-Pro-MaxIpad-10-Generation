<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - iOS</title>
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent-blue: #007aff;
            --success-green: #34c759;
            --error-red: #ff3b30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a, #000000);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .ios-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 430px;
            margin: 0 auto;
            background: var(--bg-primary);
            position: relative;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            height: 44px;
        }

        .time {
            font-weight: 600;
        }

        .status-indicators {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .carrier {
            font-size: 14px;
        }

        .right-indicators {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .back-arrow {
            font-size: 18px;
        }

        .header-title {
            flex: 1;
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            margin-left: -60px;
        }

        /* Auth Content */
        .auth-content {
            flex: 1;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .auth-logo {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
        }

        .auth-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.4;
        }

        .auth-form {
            width: 100%;
            max-width: 320px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent-blue);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .auth-button {
            width: 100%;
            padding: 16px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 15px;
        }

        .auth-button:hover {
            background: #0056d3;
        }

        .auth-button:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
        }

        .auth-toggle {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 16px;
            text-align: center;
            display: block;
            margin-bottom: 30px;
        }

        .auth-options {
            width: 100%;
            max-width: 320px;
        }

        .divider {
            text-align: center;
            color: var(--text-secondary);
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            background: var(--bg-primary);
            padding: 0 15px;
        }

        .social-button {
            width: 100%;
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            transition: background-color 0.2s;
        }

        .social-button:hover {
            background: #2c2c2e;
        }

        .forgot-password {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 14px;
            text-align: center;
            display: block;
            margin-top: 20px;
        }

        /* Home Indicator */
        .home-indicator {
            width: 134px;
            height: 5px;
            background: var(--text-primary);
            border-radius: 2.5px;
            margin: 20px auto;
            opacity: 0.3;
        }

        /* Loading State */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid var(--text-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Success/Error Messages */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: rgba(52, 199, 89, 0.2);
            color: var(--success-green);
            border: 1px solid var(--success-green);
        }

        .message.error {
            background: rgba(255, 59, 48, 0.2);
            color: var(--error-red);
            border: 1px solid var(--error-red);
        }

        .auth-mode-signup .auth-form {
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="ios-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="time" id="time">20:30</div>
            <div class="status-indicators">
                <span class="carrier">Fri 13 Sep</span>
                <div class="right-indicators">
                    <span class="signal">Verizon 📶</span>
                    <span class="wifi">📶</span>
                    <span class="battery">85% 🔋</span>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="navigateBack()">
                <span class="back-arrow">‹</span>
                <span>Back</span>
            </button>
            <h1 class="header-title">Sign In</h1>
        </div>

        <!-- Authentication Content -->
        <div class="auth-content">
            <div class="auth-logo">🔐</div>
            <h2 class="auth-title">Welcome to iOS</h2>
            <p class="auth-subtitle">Sign in with your Apple ID to access your apps, data, and settings across all your devices.</p>

            <!-- Messages -->
            <div class="message" id="authMessage"></div>

            <!-- Auth Form -->
            <form class="auth-form" id="authForm">
                <div class="form-group">
                    <input 
                        type="email" 
                        class="form-input" 
                        id="email" 
                        placeholder="Apple ID or Email" 
                        required
                        autocomplete="email"
                    >
                </div>
                
                <div class="form-group">
                    <input 
                        type="password" 
                        class="form-input" 
                        id="password" 
                        placeholder="Password" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                    <input 
                        type="password" 
                        class="form-input" 
                        id="confirmPassword" 
                        placeholder="Confirm Password"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="auth-button" id="authButton">
                    <span class="button-text">Sign In</span>
                    <div class="loading" id="buttonLoading">
                        <div class="spinner"></div>
                        <span>Signing In...</span>
                    </div>
                </button>
            </form>

            <a href="#" class="auth-toggle" id="authToggle">Don't have an Apple ID? Create one</a>

            <!-- Social Auth Options -->
            <div class="auth-options">
                <div class="divider"><span>or</span></div>
                
                <button class="social-button" onclick="signInWithFaceID()">
                    <span>👤</span>
                    <span>Sign In with Face ID</span>
                </button>

                <button class="social-button" onclick="signInWithTouchID()">
                    <span>👆</span>
                    <span>Sign In with Touch ID</span>
                </button>
            </div>

            <a href="#" class="forgot-password" onclick="forgotPassword()">Forgot Apple ID or Password?</a>
        </div>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>
    </div>

    <script>
        class AuthSystem {
            constructor() {
                this.isSignUpMode = false;
                this.users = JSON.parse(localStorage.getItem('users') || '[]');
                this.currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
                
                this.initializeElements();
                this.setupEventListeners();
                this.updateTime();
                
                // Check if user is already signed in
                if (this.currentUser) {
                    this.showSignedInState();
                }
            }

            initializeElements() {
                this.form = document.getElementById('authForm');
                this.emailInput = document.getElementById('email');
                this.passwordInput = document.getElementById('password');
                this.confirmPasswordInput = document.getElementById('confirmPassword');
                this.confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
                this.authButton = document.getElementById('authButton');
                this.authToggle = document.getElementById('authToggle');
                this.authMessage = document.getElementById('authMessage');
                this.buttonLoading = document.getElementById('buttonLoading');
                this.timeElement = document.getElementById('time');
                this.headerTitle = document.querySelector('.header-title');
                this.authTitle = document.querySelector('.auth-title');
                this.authSubtitle = document.querySelector('.auth-subtitle');
            }

            setupEventListeners() {
                this.form.addEventListener('submit', (e) => this.handleSubmit(e));
                this.authToggle.addEventListener('click', (e) => this.toggleAuthMode(e));
            }

            updateTime() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-US', { 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                if (this.timeElement) {
                    this.timeElement.textContent = timeString;
                }
                
                setTimeout(() => this.updateTime(), 60000);
            }

            toggleAuthMode(e) {
                e.preventDefault();
                this.isSignUpMode = !this.isSignUpMode;
                
                if (this.isSignUpMode) {
                    // Switch to Sign Up mode
                    this.confirmPasswordGroup.style.display = 'block';
                    this.authButton.querySelector('.button-text').textContent = 'Create Account';
                    this.authToggle.textContent = 'Already have an Apple ID? Sign In';
                    this.headerTitle.textContent = 'Create Apple ID';
                    this.authTitle.textContent = 'Create Your Apple ID';
                    this.authSubtitle.textContent = 'Create a new Apple ID to access all Apple services and sync your data across devices.';
                    this.confirmPasswordInput.required = true;
                } else {
                    // Switch to Sign In mode
                    this.confirmPasswordGroup.style.display = 'none';
                    this.authButton.querySelector('.button-text').textContent = 'Sign In';
                    this.authToggle.textContent = "Don't have an Apple ID? Create one";
                    this.headerTitle.textContent = 'Sign In';
                    this.authTitle.textContent = 'Welcome to iOS';
                    this.authSubtitle.textContent = 'Sign in with your Apple ID to access your apps, data, and settings across all your devices.';
                    this.confirmPasswordInput.required = false;
                }
                
                this.hideMessage();
                document.body.classList.toggle('auth-mode-signup', this.isSignUpMode);
            }

            async handleSubmit(e) {
                e.preventDefault();
                
                const email = this.emailInput.value.trim();
                const password = this.passwordInput.value;
                const confirmPassword = this.confirmPasswordInput.value;

                // Validation
                if (!this.validateInputs(email, password, confirmPassword)) {
                    return;
                }

                this.showLoading(true);

                try {
                    await this.simulateNetworkDelay();
                    
                    if (this.isSignUpMode) {
                        this.handleSignUp(email, password);
                    } else {
                        this.handleSignIn(email, password);
                    }
                } catch (error) {
                    this.showMessage('An error occurred. Please try again.', 'error');
                } finally {
                    this.showLoading(false);
                }
            }

            validateInputs(email, password, confirmPassword) {
                if (!email || !password) {
                    this.showMessage('Please fill in all required fields.', 'error');
                    return false;
                }

                if (!this.isValidEmail(email)) {
                    this.showMessage('Please enter a valid email address.', 'error');
                    return false;
                }

                if (password.length < 6) {
                    this.showMessage('Password must be at least 6 characters long.', 'error');
                    return false;
                }

                if (this.isSignUpMode && password !== confirmPassword) {
                    this.showMessage('Passwords do not match.', 'error');
                    return false;
                }

                return true;
            }

            handleSignUp(email, password) {
                // Check if user already exists
                if (this.users.some(user => user.email === email)) {
                    this.showMessage('An account with this email already exists.', 'error');
                    return;
                }

                // Create new user
                const newUser = {
                    id: Date.now().toString(),
                    email: email,
                    password: password, // In real app, this would be hashed
                    createdAt: new Date().toISOString(),
                    name: email.split('@')[0]
                };

                this.users.push(newUser);
                localStorage.setItem('users', JSON.stringify(this.users));
                localStorage.setItem('currentUser', JSON.stringify(newUser));
                
                this.currentUser = newUser;
                this.showMessage('Account created successfully!', 'success');
                
                setTimeout(() => {
                    this.showSignedInState();
                }, 1500);
            }

            handleSignIn(email, password) {
                // Find user
                const user = this.users.find(u => u.email === email && u.password === password);
                
                if (!user) {
                    this.showMessage('Invalid email or password.', 'error');
                    return;
                }

                localStorage.setItem('currentUser', JSON.stringify(user));
                this.currentUser = user;
                this.showMessage('Signed in successfully!', 'success');
                
                setTimeout(() => {
                    this.showSignedInState();
                }, 1500);
            }

            showSignedInState() {
                // Update UI to show signed in state
                this.authTitle.textContent = `Welcome back, ${this.currentUser.name}!`;
                this.authSubtitle.textContent = 'You are successfully signed in to your Apple ID.';
                
                // Hide form and show success actions
                this.form.style.display = 'none';
                this.authToggle.style.display = 'none';
                document.querySelector('.auth-options').style.display = 'none';
                document.querySelector('.forgot-password').style.display = 'none';

                // Show signed in actions
                const actionsHtml = `
                    <div style="width: 100%; max-width: 320px; margin-top: 30px;">
                        <button class="auth-button" onclick="window.location.href='home.html'" style="margin-bottom: 15px;">
                            Open Settings
                        </button>
                        <button class="auth-button" onclick="window.location.href='homescreen.html'" style="background: var(--success-green); margin-bottom: 15px;">
                            Go to Home Screen
                        </button>
                        <button class="social-button" onclick="authSystem.signOut()" style="color: var(--error-red);">
                            Sign Out
                        </button>
                    </div>
                `;
                
                document.querySelector('.auth-content').insertAdjacentHTML('beforeend', actionsHtml);
            }

            signOut() {
                localStorage.removeItem('currentUser');
                window.location.reload();
            }

            showLoading(show) {
                const buttonText = this.authButton.querySelector('.button-text');
                
                if (show) {
                    buttonText.style.display = 'none';
                    this.buttonLoading.style.display = 'flex';
                    this.authButton.disabled = true;
                } else {
                    buttonText.style.display = 'inline';
                    this.buttonLoading.style.display = 'none';
                    this.authButton.disabled = false;
                }
            }

            showMessage(text, type) {
                this.authMessage.textContent = text;
                this.authMessage.className = `message ${type}`;
                this.authMessage.style.display = 'block';
                
                if (type === 'success') {
                    setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                this.authMessage.style.display = 'none';
            }

            isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            async simulateNetworkDelay() {
                await new Promise(resolve => setTimeout(resolve, 1500));
            }
        }

        // Global functions
        function navigateBack() {
            const container = document.querySelector('.ios-container');
            container.style.opacity = '0.8';
            container.style.transform = 'translateX(20px)';
            setTimeout(() => {
                window.location.href = 'homescreen.html';
            }, 150);
        }

        function signInWithFaceID() {
            const message = document.getElementById('authMessage');
            message.textContent = 'Face ID authentication would be available on a real device.';
            message.className = 'message';
            message.style.display = 'block';
            message.style.background = 'rgba(142, 142, 147, 0.2)';
            message.style.color = 'var(--text-secondary)';
            message.style.border = '1px solid var(--text-secondary)';
        }

        function signInWithTouchID() {
            const message = document.getElementById('authMessage');
            message.textContent = 'Touch ID authentication would be available on a real device.';
            message.className = 'message';
            message.style.display = 'block';
            message.style.background = 'rgba(142, 142, 147, 0.2)';
            message.style.color = 'var(--text-secondary)';
            message.style.border = '1px solid var(--text-secondary)';
        }

        function forgotPassword() {
            const message = document.getElementById('authMessage');
            message.textContent = 'Password recovery would redirect to Apple\'s official recovery process.';
            message.className = 'message';
            message.style.display = 'block';
            message.style.background = 'rgba(142, 142, 147, 0.2)';
            message.style.color = 'var(--text-secondary)';
            message.style.border = '1px solid var(--text-secondary)';
        }

        // Initialize the auth system
        let authSystem;
        document.addEventListener('DOMContentLoaded', () => {
            authSystem = new AuthSystem();
        });
    </script>
    <script src="device-state.js"></script>
</body>
</html>
