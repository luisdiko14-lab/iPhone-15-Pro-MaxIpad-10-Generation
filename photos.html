<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; min-height: 100vh; max-width: 480px; margin: 0 auto; }
.status-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 6px; font-size: 13px; font-weight: 600; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px 12px; }
.header h1 { font-size: 28px; font-weight: 700; }
.header-btns { display: flex; gap: 10px; }
.hbtn { background: none; border: none; color: #007aff; font-size: 15px; cursor: pointer; padding: 4px 8px; }
.section-label { font-size: 13px; font-weight: 600; color: #8e8e93; padding: 4px 16px 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 0 2px; }
.thumb { aspect-ratio: 1; overflow: hidden; cursor: pointer; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .del-x { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); border: none; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 13px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 2; }
.editing .del-x { display: flex; }
.thumb .video-badge { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.55); border-radius: 4px; font-size: 11px; padding: 2px 5px; }
.empty { text-align: center; padding: 80px 30px; color: #8e8e93; }
.empty .icon { font-size: 60px; margin-bottom: 16px; }
.empty p { font-size: 16px; line-height: 1.5; }

/* Recents / Albums tabs */
.tab-bar { display: flex; border-bottom: 1px solid #333; margin-bottom: 4px; }
.tab { flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: 500; color: #8e8e93; cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: #007aff; border-bottom-color: #007aff; }

/* Albums grid */
.albums-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 12px 14px; }
.album-card { cursor: pointer; }
.album-thumb { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #2c2c2e; margin-bottom: 6px; position: relative; }
.album-thumb img { width: 100%; height: 100%; object-fit: cover; }
.album-thumb .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 40px; }
.album-name { font-size: 14px; font-weight: 600; }
.album-count { font-size: 13px; color: #8e8e93; }

/* Lightbox */
.lightbox { display: none; position: fixed; inset: 0; background: #000; z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 80vh; object-fit: contain; }
.lightbox-toolbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
.lb-close { background: none; border: none; color: #fff; font-size: 17px; cursor: pointer; }
.lightbox-actions { position: absolute; bottom: 30px; display: flex; gap: 40px; }
.lb-action { background: none; border: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; }
.lb-action .ic { font-size: 22px; }
.lb-caption { color: #fff; font-size: 13px; }

/* Memories banner */
.memories-banner { margin: 8px 14px; border-radius: 14px; overflow: hidden; position: relative; height: 160px; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: flex-end; padding: 14px; }
.memories-banner .mem-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-bottom: 4px; }
.memories-banner .mem-title { font-size: 22px; font-weight: 800; }
.memories-banner .mem-play { position: absolute; top: 50%; right: 20px; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.25); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }
</style>
</head>
<body>
<div class="status-bar">
  <span id="status-time">9:41</span>
  <span>📶 🔋</span>
</div>

<div class="header">
  <button class="hbtn" onclick="history.back()">‹ Back</button>
  <h1 id="page-title">Photos</h1>
  <button class="hbtn" id="edit-btn" onclick="toggleEdit()">Select</button>
</div>

<div class="tab-bar">
  <div class="tab active" onclick="switchTab('recents')">Recents</div>
  <div class="tab" onclick="switchTab('albums')">Albums</div>
</div>

<div id="recents-view">
  <!-- Memories -->
  <div class="memories-banner">
    <div>
      <div class="mem-label">Memory</div>
      <div class="mem-title">Best of the year</div>
    </div>
    <div class="mem-play">▶</div>
  </div>
  <div class="section-label" id="photo-count-label">All Photos</div>
  <div class="grid" id="photo-grid"></div>
  <div class="empty" id="empty-state" style="display:none">
    <div class="icon">🖼️</div>
    <p>No photos yet.<br>Take some photos with the Camera app!</p>
    <br>
    <button onclick="window.location.href='camera.html'" style="background:#007aff;color:#fff;border:none;padding:12px 24px;border-radius:12px;font-size:16px;cursor:pointer;">Open Camera</button>
  </div>
</div>

<div id="albums-view" style="display:none">
  <div class="section-label">My Albums</div>
  <div class="albums-grid" id="albums-grid"></div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-toolbar">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <span class="lb-caption" id="lb-caption"></span>
    <button class="lb-close" onclick="sharePhoto()">⬆️</button>
  </div>
  <img id="lb-img" src="" alt="">
  <div class="lightbox-actions">
    <button class="lb-action" onclick="prevPhoto()"><span class="ic">‹</span><span>Prev</span></button>
    <button class="lb-action" onclick="favoritePhoto()"><span class="ic" id="lb-fav">🤍</span><span>Favorite</span></button>
    <button class="lb-action" onclick="deletePhoto()"><span class="ic">🗑️</span><span>Delete</span></button>
    <button class="lb-action" onclick="nextPhoto()"><span class="ic">›</span><span>Next</span></button>
  </div>
</div>

<script>
let photos = JSON.parse(localStorage.getItem('cameraRoll') || '[]');
let favorites = JSON.parse(localStorage.getItem('photoFavorites') || '[]');
let isEditing = false;
let lightboxIdx = 0;
const grid = document.getElementById('photo-grid');
const emptyState = document.getElementById('empty-state');

// Seed with placeholder iOS-style photos if empty
const SEEDS = [
  { dataUrl: null, gradient: 'linear-gradient(135deg,#667eea,#764ba2)', emoji: '🌅', label: 'Sunset' },
  { dataUrl: null, gradient: 'linear-gradient(135deg,#f093fb,#f5576c)', emoji: '🌸', label: 'Spring' },
  { dataUrl: null, gradient: 'linear-gradient(135deg,#4facfe,#00f2fe)', emoji: '🌊', label: 'Ocean' },
  { dataUrl: null, gradient: 'linear-gradient(135deg,#43e97b,#38f9d7)', emoji: '🌿', label: 'Nature' },
  { dataUrl: null, gradient: 'linear-gradient(135deg,#fa709a,#fee140)', emoji: '🌺', label: 'Flowers' },
  { dataUrl: null, gradient: 'linear-gradient(135deg,#a18cd1,#fbc2eb)', emoji: '🦋', label: 'Garden' },
];

function getDisplayPhotos() {
  // Real camera photos + seed placeholders
  const real = photos.map((p, i) => ({ src: p.dataUrl || p, date: p.date || new Date().toLocaleDateString(), real: true, idx: i }));
  const seeded = SEEDS.map((s, i) => ({ gradient: s.gradient, emoji: s.emoji, label: s.label, real: false, seedIdx: i }));
  return [...real, ...seeded];
}

function renderGrid() {
  grid.innerHTML = '';
  const all = getDisplayPhotos();
  if (photos.length === 0 && all.length === 6) {
    // show seeds but no empty state
  }
  document.getElementById('photo-count-label').textContent = `All Photos · ${all.length}`;

  all.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    if (item.real) {
      div.innerHTML = `<img src="${item.src}" alt="Photo ${i+1}" loading="lazy">`;
      const delBtn = document.createElement('button');
      delBtn.className = 'del-x';
      delBtn.innerHTML = '✕';
      delBtn.onclick = (e) => { e.stopPropagation(); deleteByIdx(item.idx); };
      div.appendChild(delBtn);
    } else {
      div.innerHTML = `<div style="width:100%;height:100%;background:${item.gradient};display:flex;align-items:center;justify-content:center;font-size:36px;">${item.emoji}</div>`;
    }
    div.addEventListener('click', () => openLightbox(i, all));
    grid.appendChild(div);
  });

  if (isEditing) grid.classList.add('editing'); else grid.classList.remove('editing');
}

function renderAlbums() {
  const ag = document.getElementById('albums-grid');
  const albumDefs = [
    { name: 'Recents', emoji: '🕐', count: photos.length + SEEDS.length },
    { name: 'Favorites', emoji: '❤️', count: favorites.length },
    { name: 'Camera', emoji: '📷', count: photos.length },
    { name: 'Screenshots', emoji: '📱', count: 0 },
    { name: 'Live Photos', emoji: '🎞️', count: 0 },
    { name: 'Selfies', emoji: '🤳', count: 0 },
  ];
  ag.innerHTML = '';
  albumDefs.forEach(a => {
    const seed = SEEDS[Math.floor(Math.random() * SEEDS.length)];
    ag.innerHTML += `<div class="album-card" onclick="switchTab('recents')">
      <div class="album-thumb"><div class="placeholder" style="background:${seed.gradient}">${a.emoji}</div></div>
      <div class="album-name">${a.name}</div>
      <div class="album-count">${a.count}</div>
    </div>`;
  });
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0) === (tab==='recents')));
  document.getElementById('recents-view').style.display = tab === 'recents' ? '' : 'none';
  document.getElementById('albums-view').style.display = tab === 'albums' ? '' : 'none';
}

function toggleEdit() {
  isEditing = !isEditing;
  document.getElementById('edit-btn').textContent = isEditing ? 'Done' : 'Select';
  renderGrid();
}

function deleteByIdx(realIdx) {
  photos.splice(realIdx, 1);
  localStorage.setItem('cameraRoll', JSON.stringify(photos));
  renderGrid();
}

let lbAll = [];
function openLightbox(i, all) {
  lbAll = all;
  lightboxIdx = i;
  showLightboxItem();
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
function showLightboxItem() {
  const item = lbAll[lightboxIdx];
  const img = document.getElementById('lb-img');
  if (item.real) {
    img.src = item.src;
  } else {
    // generate a colored div as img (canvas trick)
    const c = document.createElement('canvas'); c.width=400; c.height=400;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0,0,400,400);
    g.addColorStop(0, '#667eea'); g.addColorStop(1, '#764ba2');
    ctx.fillStyle = g; ctx.fillRect(0,0,400,400);
    ctx.font='120px serif'; ctx.textAlign='center'; ctx.fillText(item.emoji,200,240);
    img.src = c.toDataURL();
  }
  document.getElementById('lb-caption').textContent = `${lightboxIdx + 1} / ${lbAll.length}`;
  const fav = document.getElementById('lb-fav');
  fav.textContent = favorites.includes(lightboxIdx) ? '❤️' : '🤍';
}
function prevPhoto() { lightboxIdx = (lightboxIdx - 1 + lbAll.length) % lbAll.length; showLightboxItem(); }
function nextPhoto() { lightboxIdx = (lightboxIdx + 1) % lbAll.length; showLightboxItem(); }
function favoritePhoto() {
  const i = favorites.indexOf(lightboxIdx);
  if (i >= 0) favorites.splice(i, 1); else favorites.push(lightboxIdx);
  localStorage.setItem('photoFavorites', JSON.stringify(favorites));
  document.getElementById('lb-fav').textContent = favorites.includes(lightboxIdx) ? '❤️' : '🤍';
}
function deletePhoto() {
  const item = lbAll[lightboxIdx];
  if (!item.real) { closeLightbox(); return; }
  photos.splice(item.idx, 1);
  localStorage.setItem('cameraRoll', JSON.stringify(photos));
  closeLightbox();
  renderGrid();
}
function sharePhoto() {
  const item = lbAll[lightboxIdx];
  const url = item.real ? item.src : null;
  if (url && navigator.share) { navigator.share({ files: [] }); }
  else { const t = document.createElement('div'); t.textContent = 'Shared!'; t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#333;color:#fff;padding:12px 24px;border-radius:12px;z-index:999'; document.body.appendChild(t); setTimeout(()=>t.remove(),1200); }
}

// Status bar time
function tick() { const d=new Date(); document.getElementById('status-time').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
tick(); setInterval(tick,1000);

renderGrid();
renderAlbums();
</script>
</body>
</html>
