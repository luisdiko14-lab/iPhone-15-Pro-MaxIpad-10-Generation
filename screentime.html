<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Time</title>
<style>
:root {
  --bg-color: #000000;
  --card-bg: #1c1c1e;
  --text-primary: #ffffff;
  --text-secondary: #8e8e93;
  --accent: #007aff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg-color);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 12px 20px 6px;
  font-size: 13px;
  font-weight: 600;
}
.header {
  display: flex;
  align-items: center;
  padding: 8px 16px 12px;
}
.header h1 {
  font-size: 17px;
  font-weight: 600;
  flex: 1;
  text-align: center;
}
.back-btn {
  color: var(--accent);
  background: none;
  border: none;
  font-size: 17px;
  cursor: pointer;
}
.chart-container {
  padding: 16px;
  background: var(--card-bg);
  margin: 16px;
  border-radius: 12px;
}
.chart-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 8px;
}
.chart-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 16px;
}
#usage-chart {
  width: 100%;
  height: 150px;
}
.section {
  margin-top: 20px;
}
.list {
  background: var(--card-bg);
  border-top: 0.5px solid #38383a;
  border-bottom: 0.5px solid #38383a;
}
.list-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  border-bottom: 0.5px solid #38383a;
}
.list-item:last-child {
  border-bottom: none;
}
.item-icon {
  width: 29px;
  height: 29px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.item-label {
  flex: 1;
  font-size: 17px;
}
.chevron {
  color: #3a3a3c;
  font-size: 20px;
}
</style>
</head>
<body>
<div class="status-bar">
  <button onclick="history.back()" class="back-btn">‹ Settings</button>
  <span id="st">9:41</span>
  <span>📶 🔋</span>
</div>

<div class="header">
  <h1>Screen Time</h1>
</div>

<div class="chart-container">
  <div class="chart-title">Daily Average</div>
  <div class="chart-subtitle">3h 45m</div>
  <canvas id="usage-chart" width="400" height="150"></canvas>
</div>

<div class="section">
  <div class="list">
    <div class="list-item">
      <div class="item-icon" style="background: #5856d6;">⏳</div>
      <div class="item-label">Downtime</div>
      <div class="chevron">›</div>
    </div>
    <div class="list-item">
      <div class="item-icon" style="background: #ff9500;">⌛</div>
      <div class="item-label">App Limits</div>
      <div class="chevron">›</div>
    </div>
    <div class="list-item">
      <div class="item-icon" style="background: #007aff;">🛡️</div>
      <div class="item-label">Content & Privacy Restrictions</div>
      <div class="chevron">›</div>
    </div>
  </div>
</div>

<script>
function tick(){const d=new Date();document.getElementById('st').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`}
tick();setInterval(tick,1000);

const canvas = document.getElementById('usage-chart');
const ctx = canvas.getContext('2d');
const data = [45, 120, 60, 200, 150, 90, 180];
const labels = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const max = Math.max(...data);
const w = canvas.width;
const h = canvas.height;
const barWidth = 30;
const spacing = (w - (barWidth * data.length)) / (data.length + 1);

ctx.fillStyle = '#007aff';
data.forEach((val, i) => {
  const barHeight = (val / max) * (h - 20);
  const x = spacing + i * (barWidth + spacing);
  const y = h - barHeight - 20;
  
  // Draw bar
  ctx.beginPath();
  ctx.roundRect(x, y, barWidth, barHeight, 5);
  ctx.fill();
  
  // Draw label
  ctx.fillStyle = '#8e8e93';
  ctx.font = '12px -apple-system';
  ctx.textAlign = 'center';
  ctx.fillText(labels[i], x + barWidth/2, h - 5);
  ctx.fillStyle = '#007aff';
});
</script>
</body>
</html>
