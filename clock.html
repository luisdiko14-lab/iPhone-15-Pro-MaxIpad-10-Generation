<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;overflow:hidden}
.status-bar{display:flex;justify-content:space-between;padding:12px 20px 6px;font-size:13px;font-weight:600;flex-shrink:0}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 4px;flex-shrink:0}
.header h1{font-size:28px;font-weight:700}
.header .add-btn{background:none;border:none;color:#ff9500;font-size:24px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.tab-bar{display:flex;border-bottom:1px solid #2c2c2e;flex-shrink:0}
.tab{flex:1;text-align:center;padding:10px;font-size:13px;font-weight:500;color:#8e8e93;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:#ff9500;border-bottom-color:#ff9500}
.view{flex:1;overflow-y:auto;display:none}
.view.active{display:block}

    /* World Clock */
    .wc-item{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #2c2c2e;cursor:grab}
    .wc-item:active{cursor:grabbing;background:#1c1c1e}
    .wc-left .city{font-size:22px;font-weight:500}
    .wc-left .rel{font-size:13px;color:#8e8e93;margin-top:2px}
    .wc-time{text-align:right}
    .wc-ampm{font-size:16px;color:#8e8e93;margin-right:4px}
    .wc-hm{font-size:48px;font-weight:200;line-height:1}

    /* Alarm Editor Modal */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;align-items:center;justify-content:center}
    .modal-overlay.active{display:flex}
    .modal-content{background:#1c1c1e;width:90%;max-width:320px;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:15px}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .modal-title{font-size:18px;font-weight:600}
    .time-inputs{display:flex;gap:10px;justify-content:center;align-items:center}
    .time-inputs input{background:#2c2c2e;border:1px solid #3a3a3c;color:#fff;padding:8px;border-radius:8px;width:60px;text-align:center;font-size:24px}
    .repeat-days{display:flex;justify-content:space-between;gap:5px}
    .day-btn{width:32px;height:32px;border-radius:50%;background:#2c2c2e;border:none;color:#fff;font-size:12px;cursor:pointer}
    .day-btn.active{background:#ff9500;color:#000}
    .modal-row{display:flex;justify-content:space-between;align-items:center;font-size:15px}
    .modal-row input[type="text"]{background:#2c2c2e;border:1px solid #3a3a3c;color:#fff;padding:8px;border-radius:8px;width:120px}
    .modal-actions{display:flex;gap:10px;margin-top:10px}
    .modal-btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:600;cursor:pointer}
    .modal-btn.cancel{background:#3a3a3c;color:#fff}
    .modal-btn.save{background:#ff9500;color:#000}

    /* Alarm Banner */
    #alarm-banner{display:none;position:fixed;top:20px;left:20px;right:20px;background:#ff9500;color:#000;padding:20px;border-radius:16px;z-index:2000;box-shadow:0 10px 30px rgba(0,0,0,0.5);text-align:center}
    #alarm-banner h2{margin-bottom:10px}
    .banner-btns{display:flex;gap:10px;margin-top:15px}
    .banner-btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;background:#000;color:#ff9500}

    /* Sleep Schedule */
    .sleep-view{padding:20px;text-align:center}
    .clock-face{width:260px;height:260px;border-radius:50%;border:4px solid #2c2c2e;margin:20px auto;position:relative}
    .clock-hand{position:absolute;top:50%;left:50%;width:4px;height:100px;background:#ff9500;transform-origin:bottom;border-radius:4px}
    .clock-hand.bedtime{background:#5856d6}
    .clock-hand.waketime{background:#ffcc00}
    .sleep-stats{display:flex;justify-content:space-around;margin-top:20px}
    .sleep-stat-item div:first-child{color:#8e8e93;font-size:12px;text-transform:uppercase}
    .sleep-stat-item div:last-child{font-size:20px;font-weight:600}

    /* Timer Enhancements */
    #timer-canvas{position:fixed;inset:0;pointer-events:none;z-index:1500;display:none;background:rgba(255,255,255,0.5)}
    .timer-label-input{background:none;border:none;color:#8e8e93;text-align:center;width:100%;font-size:16px;margin-bottom:10px}
    .timer-label-input:focus{outline:none;color:#fff}

/* Alarm */
.alarm-item{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #2c2c2e}
.al-time{font-size:48px;font-weight:200;line-height:1}
.al-label{font-size:13px;color:#8e8e93;margin-top:4px}
.al-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.toggle{position:relative;width:51px;height:31px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;border-radius:31px;background:#3a3a3c;transition:background .2s}
.toggle input:checked~.toggle-track{background:#ff9500}
.toggle-knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.toggle input:checked~.toggle-knob{transform:translateX(20px)}
.add-alarm-btn{margin:20px auto;display:flex;align-items:center;justify-content:center;gap:8px;background:#ff9500;color:#000;border:none;border-radius:12px;padding:14px 32px;font-size:16px;font-weight:600;cursor:pointer;width:calc(100% - 36px)}

/* Stopwatch */
.sw-display{text-align:center;padding:30px 0 16px;font-size:80px;font-weight:200;letter-spacing:-2px;flex-shrink:0}
.sw-ms{font-size:40px;font-weight:200;color:#8e8e93}
.sw-btns{display:flex;justify-content:center;gap:30px;padding:10px 0 20px}
.sw-btn{width:80px;height:80px;border-radius:50%;border:none;font-size:17px;font-weight:600;cursor:pointer;transition:opacity .1s}
.sw-btn:active{opacity:.7}
.sw-btn.green{background:#30d158;color:#000}
.sw-btn.gray{background:#2c2c2e;color:#fff}
.sw-btn.red{background:#ff3b30;color:#fff}
.lap-list{overflow-y:auto;flex:1;padding:0 18px}
.lap-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2c2c2e;font-size:15px}
.lap-best{color:#30d158}
.lap-worst{color:#ff3b30}

/* Timer */
.timer-display{text-align:center;padding:20px 0 10px;font-size:80px;font-weight:200;letter-spacing:-2px}
.timer-picker{display:flex;justify-content:center;gap:0;padding:10px 0 20px;height:200px;overflow:hidden}
.picker-col{display:flex;flex-direction:column;align-items:center;width:80px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none}
.picker-col::-webkit-scrollbar{display:none}
.picker-col div{height:44px;line-height:44px;font-size:28px;font-weight:300;scroll-snap-align:center;cursor:pointer;color:#8e8e93;width:100%;text-align:center}
.picker-col div.sel{color:#fff;font-size:32px;font-weight:400}
.picker-label{font-size:13px;color:#8e8e93;margin-top:2px}
.timer-btns{display:flex;justify-content:center;gap:30px;padding:10px 0}
.timer-btn{width:80px;height:80px;border-radius:50%;border:none;font-size:17px;font-weight:600;cursor:pointer}
.timer-btn.green{background:#30d158;color:#000}
.timer-btn.gray{background:#2c2c2e;color:#fff}
.timer-btn.red{background:#ff3b30;color:#fff}
.timer-presets{display:flex;flex-wrap:wrap;gap:10px;padding:0 18px}
.preset-btn{background:#2c2c2e;border:none;color:#fff;border-radius:20px;padding:8px 16px;font-size:14px;cursor:pointer}
.preset-btn:active{opacity:.7}
.sw-view-inner{display:flex;flex-direction:column;height:100%;padding:0}
</style>
</head>
<body>
<div class="status-bar">
  <span id="st">9:41</span>
  <span>📶 🔋</span>
</div>
<div class="header">
  <h1 id="page-hdr">World Clock</h1>
  <button class="add-btn" id="hdr-add">+</button>
</div>
<div class="tab-bar">
  <div class="tab active" onclick="switchTab(0)">World</div>
  <div class="tab" onclick="switchTab(1)">Alarm</div>
  <div class="tab" onclick="switchTab(2)">Stopwatch</div>
  <div class="tab" onclick="switchTab(3)">Timer</div>
  <div class="tab" onclick="switchTab(4)">Sleep</div>
</div>

<!-- World Clock -->
<div class="view active" id="view-0" style="overflow-y:auto"></div>

<!-- Alarm -->
<div class="view" id="view-1" style="overflow-y:auto">
  <div id="alarm-list"></div>
  <button class="add-alarm-btn" onclick="openAlarmEditor()">+ Add Alarm</button>
</div>

<!-- Stopwatch -->
<div class="view" id="view-2">
  <div class="sw-view-inner">
    <div class="sw-display" id="sw-display">00:00<span class="sw-ms">.00</span></div>
    <div class="sw-btns">
      <button class="sw-btn gray" id="sw-lap-reset" onclick="swLapReset()">Lap</button>
      <button class="sw-btn green" id="sw-start-stop" onclick="swStartStop()">Start</button>
    </div>
    <div style="padding:10px 18px; display:flex; justify-content:space-between">
        <button onclick="shareLaps()" style="background:none;border:none;color:#ff9500;cursor:pointer">Share Laps</button>
        <button onclick="copyLaps()" style="background:none;border:none;color:#ff9500;cursor:pointer">Copy Laps</button>
    </div>
    <div class="lap-list" id="lap-list"></div>
  </div>
</div>

<!-- Timer -->
<div class="view" id="view-3" style="overflow-y:auto;padding-bottom:40px">
  <div class="timer-display" id="timer-display">00:00:00</div>
  <input type="text" class="timer-label-input" id="timer-label" placeholder="Timer Label" value="Timer">
  <div class="timer-picker" id="timer-picker">
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="picker-col" id="pc-h"></div>
      <div class="picker-label">hours</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="picker-col" id="pc-m"></div>
      <div class="picker-label">min</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="picker-col" id="pc-s"></div>
      <div class="picker-label">sec</div>
    </div>
  </div>
  <div class="timer-btns">
    <button class="timer-btn gray" onclick="timerCancel()">Cancel</button>
    <button class="timer-btn green" id="timer-start-btn" onclick="timerStartStop()">Start</button>
  </div>
  <div style="padding:12px 18px 8px;font-size:13px;color:#8e8e93;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Quick Set</div>
  <div class="timer-presets">
    <button class="preset-btn" onclick="setPreset(1,0,0)">1 hr</button>
    <button class="preset-btn" onclick="setPreset(0,30,0)">30 min</button>
    <button class="preset-btn" onclick="setPreset(0,10,0)">10 min</button>
    <button class="preset-btn" onclick="setPreset(0,5,0)">5 min</button>
    <button class="preset-btn" onclick="setPreset(0,3,0)">3 min</button>
    <button class="preset-btn" onclick="setPreset(0,1,0)">1 min</button>
    <button class="preset-btn" onclick="setPreset(0,0,30)">30 sec</button>
  </div>
</div>

<!-- Sleep Schedule -->
<div class="view" id="view-4">
    <div class="sleep-view">
        <h2>Sleep Schedule</h2>
        <div class="clock-face">
            <div id="bedtime-hand" class="clock-hand bedtime"></div>
            <div id="waketime-hand" class="clock-hand waketime"></div>
        </div>
        <div class="sleep-stats">
            <div class="sleep-stat-item">
                <div>Bedtime</div>
                <div id="bedtime-val">22:00</div>
            </div>
            <div class="sleep-stat-item">
                <div>Wake Up</div>
                <div id="waketime-val">07:00</div>
            </div>
        </div>
        <div style="margin-top:30px">
            <div style="color:#8e8e93; font-size:14px">Sleep Duration</div>
            <div style="font-size:24px; font-weight:700">9 hours</div>
        </div>
    </div>
</div>

<!-- Modals & Banners -->
<div class="modal-overlay" id="alarm-modal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title">Edit Alarm</span>
        </div>
        <div class="time-inputs">
            <input type="number" id="edit-h" min="0" max="23" placeholder="HH">
            <span style="font-size:24px">:</span>
            <input type="number" id="edit-m" min="0" max="59" placeholder="MM">
        </div>
        <div class="modal-row">
            <span>Label</span>
            <input type="text" id="edit-label" placeholder="Alarm">
        </div>
        <div class="modal-row">
            <span>Snooze</span>
            <label class="toggle"><input type="checkbox" id="edit-snooze" checked><div class="toggle-track"></div><div class="toggle-knob"></div></label>
        </div>
        <div class="repeat-days" id="edit-days">
            <button class="day-btn" data-day="1">M</button>
            <button class="day-btn" data-day="2">T</button>
            <button class="day-btn" data-day="3">W</button>
            <button class="day-btn" data-day="4">T</button>
            <button class="day-btn" data-day="5">F</button>
            <button class="day-btn" data-day="6">S</button>
            <button class="day-btn" data-day="0">S</button>
        </div>
        <div class="modal-actions">
            <button class="modal-btn cancel" onclick="closeAlarmEditor()">Cancel</button>
            <button class="modal-btn save" onclick="saveAlarmEditor()">Save</button>
        </div>
    </div>
</div>

<div id="alarm-banner">
    <h2 id="banner-title">Alarm</h2>
    <p id="banner-time">00:00</p>
    <div class="banner-btns">
        <button class="banner-btn" onclick="snoozeAlarm()">Snooze</button>
        <button class="banner-btn" onclick="dismissAlarm()">Dismiss</button>
    </div>
</div>

<div id="timer-canvas"></div>

<script>
// Status bar
function tick(){const d=new Date();document.getElementById('st').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`}
tick();setInterval(tick,1000);

// Tabs
const HDRS=['World Clock','Alarm','Stopwatch','Timer','Sleep'];
function switchTab(i){
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',i===j));
  document.querySelectorAll('.view').forEach((v,j)=>v.classList.toggle('active',i===j));
  document.getElementById('page-hdr').textContent=HDRS[i];
  document.getElementById('hdr-add').style.display=(i===0||i===1)?'flex':'none';
  document.getElementById('hdr-add').onclick=i===0?addCity:openAlarmEditor;
  if(i===4) renderSleep();
}

// Audio context for alarms/timers
let audioCtx;
function getAudioCtx() {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function playBeep(freq = 880, duration = 1) {
    try {
        const ctx = getAudioCtx();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.3, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        o.start(ctx.currentTime);
        o.stop(ctx.currentTime + duration);
    } catch(e) {}
}

// ====== World Clock ======
let userCities = JSON.parse(localStorage.getItem('userCities') || '[]');
const SEEDED_CITIES=[
  {name:'Cupertino',tz:'America/Los_Angeles',flag:'🇺🇸'},
  {name:'New York',tz:'America/New_York',flag:'🇺🇸'},
  {name:'London',tz:'Europe/London',flag:'🇬🇧'},
  {name:'Paris',tz:'Europe/Paris',flag:'🇫🇷'},
  {name:'Tokyo',tz:'Asia/Tokyo',flag:'🇯🇵'},
  {name:'Sydney',tz:'Australia/Sydney',flag:'🇦🇺'},
  {name:'Dubai',tz:'Asia/Dubai',flag:'🇦🇪'},
  {name:'Singapore',tz:'Asia/Singapore',flag:'🇸🇬'},
  {name:'Hong Kong',tz:'Asia/Hong_Kong',flag:'🇭🇰'},
  {name:'Berlin',tz:'Europe/Berlin',flag:'🇩🇪'},
  {name:'Rome',tz:'Europe/Rome',flag:'🇮🇹'},
  {name:'Cairo',tz:'Africa/Cairo',flag:'🇪🇬'},
  {name:'Moscow',tz:'Europe/Moscow',flag:'🇷🇺'},
  {name:'Seoul',tz:'Asia/Seoul',flag:'🇰🇷'},
  {name:'Mumbai',tz:'Asia/Kolkata',flag:'🇮🇳'},
];

function cityTime(tz){
  return new Date().toLocaleTimeString('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:true});
}
function cityOffset(tz){
  const local=new Date();
  const remote=new Date(local.toLocaleString('en-US',{timeZone:tz}));
  const diff=Math.round((remote-local)/3600000);
  if(diff===0)return'Same time';
  return`${diff>0?'+':''}${diff} hr${Math.abs(diff)!==1?'s':''}`;
}
function renderWorldClock(){
  const v=document.getElementById('view-0');
  const list = userCities.length ? userCities : SEEDED_CITIES;
  v.innerHTML=list.map((c, i)=>{
    const t=cityTime(c.tz);
    const[hm,ap]=t.split(' ');
    return`<div class="wc-item" draggable="true" ondragstart="dragCity(event, ${i})" ondragover="allowDrop(event)" ondrop="dropCity(event, ${i})">
      <div class="wc-left"><div class="city">${c.flag} ${c.name}</div><div class="rel">${cityOffset(c.tz)}</div></div>
      <div class="wc-time"><span class="wc-ampm">${ap||''}</span><div class="wc-hm">${hm}</div></div>
    </div>`;
  }).join('');
}
let draggedCityIndex = null;
function dragCity(e, i) { draggedCityIndex = i; }
function allowDrop(e) { e.preventDefault(); }
function dropCity(e, i) {
    e.preventDefault();
    const list = userCities.length ? userCities : [...SEEDED_CITIES];
    const item = list.splice(draggedCityIndex, 1)[0];
    list.splice(i, 0, item);
    userCities = list;
    localStorage.setItem('userCities', JSON.stringify(userCities));
    renderWorldClock();
}

renderWorldClock();
setInterval(renderWorldClock,1000);
function addCity(){
    const name = prompt("Enter city name:");
    if(!name) return;
    const found = SEEDED_CITIES.find(c => c.name.toLowerCase().includes(name.toLowerCase()));
    if(found) {
        userCities.push(found);
        localStorage.setItem('userCities', JSON.stringify(userCities));
        renderWorldClock();
    } else {
        alert("City not found in database.");
    }
}

// ====== Alarm ======
let alarms=JSON.parse(localStorage.getItem('alarms')||'[]');
if(!alarms.length) {
    alarms = [
        {h:7, m:0, label:"Wake Up", on:true, snooze:true, days:[1,2,3,4,5]},
        {h:9, m:30, label:"Work", on:false, snooze:true, days:[1,2,3,4,5]}
    ];
}

function saveAlarms(){localStorage.setItem('alarms',JSON.stringify(alarms));}
function renderAlarms(){
  const list=document.getElementById('alarm-list');
  list.innerHTML=alarms.map((a,i)=>{
    const m=String(a.m).padStart(2,'0');
    const ap=a.h>=12?'PM':'AM';
    const h12=a.h%12||12;
    const days = a.days.length === 7 ? "Every day" : a.days.length === 0 ? "Never" : a.days.map(d => ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d]).join(", ");
    return`<div class="alarm-item">
      <div onclick="openAlarmEditor(${i})">
        <div class="al-time">${h12}:${m}<span style="font-size:22px;color:#8e8e93"> ${ap}</span></div>
        <div class="al-label">${a.label}${days ? ' - '+days : ''}</div>
      </div>
      <div class="al-right">
        <label class="toggle"><input type="checkbox" ${a.on?'checked':''} onchange="alarms[${i}].on=this.checked;saveAlarms()"><div class="toggle-track"></div><div class="toggle-knob"></div></label>
        <button onclick="deleteAlarm(${i})" style="background:none;border:none;color:#ff3b30;font-size:13px;cursor:pointer">Delete</button>
      </div>
    </div>`;
  }).join('');
}

let editingAlarmIndex = null;
function openAlarmEditor(index = null) {
    editingAlarmIndex = index;
    const modal = document.getElementById('alarm-modal');
    const alarm = index !== null ? alarms[index] : {h:7, m:0, label:"Alarm", snooze:true, days:[1,2,3,4,5]};
    
    document.getElementById('edit-h').value = alarm.h;
    document.getElementById('edit-m').value = alarm.m;
    document.getElementById('edit-label').value = alarm.label;
    document.getElementById('edit-snooze').checked = alarm.snooze;
    
    document.querySelectorAll('#edit-days .day-btn').forEach(btn => {
        btn.classList.toggle('active', alarm.days.includes(parseInt(btn.dataset.day)));
        btn.onclick = () => btn.classList.toggle('active');
    });
    
    modal.classList.add('active');
}

function closeAlarmEditor() {
    document.getElementById('alarm-modal').classList.remove('active');
}

function saveAlarmEditor() {
    const h = parseInt(document.getElementById('edit-h').value);
    const m = parseInt(document.getElementById('edit-m').value);
    const label = document.getElementById('edit-label').value;
    const snooze = document.getElementById('edit-snooze').checked;
    const days = Array.from(document.querySelectorAll('#edit-days .day-btn.active')).map(btn => parseInt(btn.dataset.day));
    
    const alarm = {h, m, label, snooze, days, on: true};
    
    if(editingAlarmIndex !== null) {
        alarms[editingAlarmIndex] = alarm;
    } else {
        alarms.push(alarm);
    }
    
    saveAlarms();
    renderAlarms();
    closeAlarmEditor();
}

function deleteAlarm(i){alarms.splice(i,1);saveAlarms();renderAlarms();}

function checkAlarms() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const day = now.getDay();

    if(s !== 0) return;

    alarms.forEach(a => {
        if(a.on && a.h === h && a.m === m && (a.days.length === 0 || a.days.includes(day))) {
            fireAlarm(a);
        }
    });
}
setInterval(checkAlarms, 1000);

let activeAlarm = null;
function fireAlarm(a) {
    activeAlarm = a;
    document.getElementById('banner-title').textContent = a.label;
    document.getElementById('banner-time').textContent = `${String(a.h).padStart(2,'0')}:${String(a.m).padStart(2,'0')}`;
    document.getElementById('alarm-banner').style.display = 'block';
    playBeep(440, 2);
    if(navigator.vibrate) navigator.vibrate([500, 500, 500]);
}

function snoozeAlarm() {
    if(!activeAlarm) return;
    document.getElementById('alarm-banner').style.display = 'none';
    const snoozeTime = new Date(Date.now() + 9 * 60000);
    alarms.push({
        h: snoozeTime.getHours(),
        m: snoozeTime.getMinutes(),
        label: "Snooze: " + activeAlarm.label,
        on: true,
        days: [],
        snooze: false
    });
    activeAlarm = null;
}

function dismissAlarm() {
    document.getElementById('alarm-banner').style.display = 'none';
    activeAlarm = null;
}

renderAlarms();

// ====== Stopwatch ======
let swRunning=false,swElapsed=0,swStart=0,swLaps=[],swRaf=null;
function swFmt(ms){
  const cs=Math.floor(ms/10)%100;
  const s=Math.floor(ms/1000)%60;
  const mn=Math.floor(ms/60000);
  return`${String(mn).padStart(2,'0')}:${String(s).padStart(2,'0')}<span class="sw-ms">.${String(cs).padStart(2,'0')}</span>`;
}
function swTick(){
  swElapsed=Date.now()-swStart;
  document.getElementById('sw-display').innerHTML=swFmt(swElapsed);
  swRaf=requestAnimationFrame(swTick);
}
function swStartStop(){
  if(swRunning){
    swRunning=false;cancelAnimationFrame(swRaf);
    document.getElementById('sw-start-stop').textContent='Start';
    document.getElementById('sw-start-stop').className='sw-btn green';
    document.getElementById('sw-lap-reset').textContent='Reset';
  } else {
    swRunning=true;swStart=Date.now()-swElapsed;
    document.getElementById('sw-start-stop').textContent='Stop';
    document.getElementById('sw-start-stop').className='sw-btn red';
    document.getElementById('sw-lap-reset').textContent='Lap';
    swTick();
  }
}
function swLapReset(){
  if(swRunning){
    swLaps.unshift({n:swLaps.length+1,t:swElapsed});
    renderLaps();
  } else {
    swElapsed=0;swLaps=[];
    document.getElementById('sw-display').innerHTML='00:00<span class="sw-ms">.00</span>';
    document.getElementById('sw-lap-reset').textContent='Lap';
    renderLaps();
  }
}
function renderLaps(){
  const list=document.getElementById('lap-list');
  if(!swLaps.length){list.innerHTML='';return;}
  const times = swLaps.map((l, i) => l.t - (swLaps[i+1]?.t || 0));
  const min=Math.min(...times),max=Math.max(...times);
  list.innerHTML=swLaps.map((l,i)=>{
    const lapTime=l.t-(swLaps[i+1]?.t||0);
    let cls = '';
    if(swLaps.length > 2) {
        if(lapTime === min) cls = 'lap-best';
        if(lapTime === max) cls = 'lap-worst';
    }
    return`<div class="lap-item ${cls}"><span>Lap ${l.n}</span><span>${swFmt(lapTime).replace(/<[^>]+>/g,'')}</span><span>${swFmt(l.t).replace(/<[^>]+>/g,'')}</span></div>`;
  }).join('');
}
function copyLaps() {
    const text = swLaps.map(l => `Lap ${l.n}: ${swFmt(l.t).replace(/<[^>]+>/g,'')}`).join('\n');
    navigator.clipboard.writeText(text);
    alert("Laps copied to clipboard");
}
function shareLaps() {
    alert("Laps shared!");
}

// ====== Timer ======
let timerRunning=false,timerRemaining=0,timerTotal=0,timerInterval=null;
let pickerH=0,pickerM=5,pickerS=0;

function buildPicker(id,max,val,setter){
  const col=document.getElementById(id);
  col.innerHTML='<div style="height:78px"></div>'+
    Array.from({length:max},(_, i)=>`<div data-v="${i}" class="${i===val?'sel':''}">${String(i).padStart(2,'0')}</div>`).join('')+
    '<div style="height:78px"></div>';
  col.querySelectorAll('div[data-v]').forEach(d=>{
    d.addEventListener('click',()=>{
      setter(parseInt(d.dataset.v));
      buildPicker(id,max,parseInt(d.dataset.v),setter);
      updateTimerDisplay();
    });
  });
  const sel=col.querySelector('.sel');
  if(sel)setTimeout(()=>sel.scrollIntoView({block:'center',behavior:'smooth'}),50);
}
function buildPickers(){
  buildPicker('pc-h',24,pickerH,v=>{pickerH=v});
  buildPicker('pc-m',60,pickerM,v=>{pickerM=v});
  buildPicker('pc-s',60,pickerS,v=>{pickerS=v});
}
function updateTimerDisplay(){
  const tot=pickerH*3600+pickerM*60+pickerS;
  const h=Math.floor(tot/3600),m=Math.floor((tot%3600)/60),s=tot%60;
  document.getElementById('timer-display').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function setPreset(h,m,s){
  pickerH=h;pickerM=m;pickerS=s;
  buildPickers();updateTimerDisplay();
}
function timerStartStop(){
  if(timerRunning){
    timerRunning=false;clearInterval(timerInterval);
    document.getElementById('timer-start-btn').textContent='Start';
    document.getElementById('timer-start-btn').className='timer-btn green';
    document.getElementById('timer-picker').style.display='flex';
  } else {
    timerTotal=pickerH*3600+pickerM*60+pickerS;
    if(!timerTotal)return;
    timerRemaining=timerTotal;timerRunning=true;
    document.getElementById('timer-picker').style.display='none';
    document.getElementById('timer-start-btn').textContent='Pause';
    document.getElementById('timer-start-btn').className='timer-btn red';
    timerInterval=setInterval(()=>{
      timerRemaining--;
      const h=Math.floor(timerRemaining/3600),m=Math.floor((timerRemaining%3600)/60),s=timerRemaining%60;
      document.getElementById('timer-display').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      if(timerRemaining<=0){
        clearInterval(timerInterval);timerRunning=false;
        document.getElementById('timer-start-btn').textContent='Start';
        document.getElementById('timer-start-btn').className='timer-btn green';
        document.getElementById('timer-picker').style.display='flex';
        
        document.getElementById('timer-canvas').style.display = 'block';
        setTimeout(() => document.getElementById('timer-canvas').style.display = 'none', 3000);
        
        playBeep(880, 2);
        if(navigator.vibrate)navigator.vibrate([500,200,500]);
        alert(document.getElementById('timer-label').value + ' Done! ⏰');
      }
    },1000);
  }
}
function timerCancel(){
  timerRunning=false;clearInterval(timerInterval);
  timerRemaining=0;
  document.getElementById('timer-display').textContent='00:00:00';
  document.getElementById('timer-start-btn').textContent='Start';
  document.getElementById('timer-start-btn').className='timer-btn green';
  document.getElementById('timer-picker').style.display='flex';
  pickerH=0;pickerM=0;pickerS=0;buildPickers();
}
buildPickers();updateTimerDisplay();

// ====== Sleep ======
function renderSleep() {
    const bedtime = 22;
    const waketime = 7;
    document.getElementById('bedtime-hand').style.transform = `translate(-50%, -100%) rotate(${bedtime * 15}deg)`;
    document.getElementById('waketime-hand').style.transform = `translate(-50%, -100%) rotate(${waketime * 15}deg)`;
}
buildPickers();updateTimerDisplay();
</script>
