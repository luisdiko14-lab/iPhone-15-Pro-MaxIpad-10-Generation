<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Game Center</title>
<link rel="stylesheet" href="gamecenter.css">
</head>
<body>
<div class="gc-container">
    <h1>Apple Game Center</h1>
    <p class="user-info">Player: <span id="player-name">User</span> | Level: <span id="player-level">5</span></p>

    <div class="games-section">
        <h2>Games</h2>
        <ul id="games-list">
            <!-- Games will be injected via JS -->
        </ul>
    </div>

    <div class="achievements-section">
        <h2>Achievements</h2>
        <ul id="achievements-list">
            <!-- Achievements injected via JS -->
        </ul>
    </div>

    <div class="score-section">
        <h2>Top Scores</h2>
        <ul id="scores-list">
            <!-- Scores injected via JS -->
        </ul>
    </div>
</div>

<script src="gamecenter.js"></script>
</body>
</html>
