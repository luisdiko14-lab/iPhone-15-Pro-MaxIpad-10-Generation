<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Pencil - Settings</title>
    <link rel="stylesheet" href="settings-page.css">
</head>
<body>
    <div class="ios-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="time">20:30</div>
            <div class="status-indicators">
                <span class="carrier">Fri 14 Aug</span>
                <div class="right-indicators">
                    <span class="signal">Verizon 📶</span>
                    <span class="wifi">📶</span>
                    <span class="battery">26% 🔋</span>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="window.location.href='home.html'">
                <span class="back-arrow">‹</span>
                <span>Settings</span>
            </button>
            <h1 class="header-title">Apple Pencil</h1>
        </div>

        <!-- Apple Pencil Info -->
        <div class="pencil-info">
            <div class="pencil-icon">✏️</div>
            <h2>Apple Pencil (2nd generation)</h2>
            <p>Connected</p>
        </div>

        <!-- Settings Groups -->
        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">Double-Tap</div>
                <div class="setting-value">Switch between current tool and eraser</div>
                <div class="chevron">›</div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Only Draw with Apple Pencil</div>
                <div class="toggle-switch">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </div>

        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">Scribble</div>
                <div class="toggle-switch active">
                    <div class="toggle-slider"></div>
                </div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Try Scribble in</div>
                <div class="setting-value">English</div>
                <div class="chevron">›</div>
            </div>
        </div>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>
    </div>

    <style>
        .pencil-info {
            text-align: center;
            padding: 40px 20px;
            background-color: var(--bg-secondary);
            margin: 0 20px 20px;
            border-radius: 10px;
        }

        .pencil-icon {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .pencil-info h2 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .pencil-info p {
            font-size: 17px;
            color: var(--success-green);
            margin: 0;
        }
    </style>
</body>
</html>
