<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multitasking & Gestures - Settings</title>
    <link rel="stylesheet" href="settings-page.css">
</head>
<body>
    <div class="ios-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="time">20:30</div>
            <div class="status-indicators">
                <span class="carrier">Fri 14 Aug</span>
                <div class="right-indicators">
                    <span class="signal">Verizon 📶</span>
                    <span class="wifi">📶</span>
                    <span class="battery">26% 🔋</span>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="window.location.href='home.html'">
                <span class="back-arrow">‹</span>
                <span>Settings</span>
            </button>
            <h1 class="header-title">Multitasking & Gestures</h1>
        </div>

        <!-- Settings Groups -->
        <div class="settings-group">
            <div class="setting-row">
                <div class="setting-label">Allow Multiple Apps</div>
                <div class="toggle-switch active">
                    <div class="toggle-slider"></div>
                </div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Picture in Picture</div>
                <div class="toggle-switch active">
                    <div class="toggle-slider"></div>
                </div>
            </div>
            <div class="setting-row">
                <div class="setting-label">Gestures</div>
                <div class="chevron">›</div>
            </div>
        </div>

        <div class="section-description">
            <p>When Allow Multiple Apps is on, you can use multiple apps at the same time with Slide Over, Split View, and Picture in Picture.</p>
        </div>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>
    </div>

    <style>
        .section-description {
            padding: 0 20px 20px;
        }

        .section-description p {
            font-size: 13px;
            line-height: 1.4;
            color: var(--text-secondary);
            margin: 0;
        }
    </style>
    <script src="device-state.js"></script>
</body>
</html>
