<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17102f">
<title>iPhone Lock Screen</title>
<style>
:root{color-scheme:dark;--white:#fff;--blue:#0a84ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#fff}
body{background:#17102f;background-image:radial-gradient(ellipse at 8% 9%,#b5a0ee 0,transparent 36%),radial-gradient(ellipse at 100% 64%,#7650ca 0,transparent 36%),linear-gradient(145deg,#8e7ad1 0%,#30236f 45%,#090a45 100%);position:relative}
body:before,body:after{content:"";position:absolute;pointer-events:none;inset:-15%;filter:blur(1px)}
body:before{background:radial-gradient(ellipse 38% 72% at 60% 24%,#17123f 0%,#21195b 54%,transparent 55%),radial-gradient(ellipse 54% 64% at 5% 66%,#6e79ce 0%,#3e4b9d 66%,transparent 67%);transform:rotate(-18deg)}
body:after{background:radial-gradient(ellipse 42% 68% at 93% 95%,#11146e 0%,#242c9c 65%,transparent 66%);opacity:.9}
.phone-ui{position:relative;z-index:1;height:100%;width:100%;max-width:430px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 24px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;align-items:center;text-align:center;text-shadow:0 2px 18px #17102f55}
.status{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650;padding:0 3px}.status-right{display:flex;gap:7px;align-items:center;font-size:12px}.battery{width:22px;height:11px;border:1px solid white;border-radius:3px;padding:2px}.battery:before{content:"";display:block;width:75%;height:100%;background:#fff;border-radius:1px}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:118px;height:32px;border-radius:20px;background:#050507;border:1px solid #25242d;z-index:3;box-shadow:0 2px 12px #0004}
.lock-symbol{font-size:15px;margin-top:30px;opacity:.9}.date{font-size:18px;font-weight:500;margin-top:3px}.clock{font-size:clamp(76px,22vw,104px);line-height:1;font-weight:250;letter-spacing:-6px;margin-top:2px;font-variant-numeric:tabular-nums;text-shadow:0 4px 25px #17102f55}
.spacer{flex:1;min-height:20px}
.auth-card{width:min(100%,330px);padding:19px 20px 17px;border:1px solid #ffffff35;border-radius:27px;background:linear-gradient(145deg,#ffffff24,#ffffff0d);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 18px 55px #08051d35;text-shadow:none}
.auth-title{font-size:17px;font-weight:650;margin-bottom:5px}.auth-hint{font-size:12px;color:#ffffffbd;min-height:18px;margin-bottom:13px}
.dots{display:flex;justify-content:center;gap:15px;margin:0 0 14px}.dot{width:10px;height:10px;border:1px solid #fff;border-radius:50%;background:transparent}.dot.filled{background:#fff;box-shadow:0 0 10px #fff8}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:245px;margin:auto}.key{height:54px;border:1px solid #ffffff30;border-radius:50%;background:#ffffff20;color:#fff;font:400 24px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;backdrop-filter:blur(12px);transition:background .12s,transform .12s}.key small{display:block;font-size:7px;letter-spacing:1.5px;margin-top:1px}.key:active{background:#ffffff48;transform:scale(.94)}.key.empty{visibility:hidden}.key.delete{font-size:13px;background:transparent;border-color:transparent}
.auth-actions{display:flex;justify-content:space-between;margin-top:13px;font-size:12px}.text-button{border:0;background:transparent;color:#fff;padding:8px;cursor:pointer;font:inherit}.error{color:#ffb7bd;animation:shake .25s 2}
.bottom-row{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:22px}.round-action{width:46px;height:46px;border-radius:50%;border:1px solid #ffffff35;background:#ffffff25;color:white;font-size:19px;display:grid;place-items:center;backdrop-filter:blur(15px)}.swipe-note{font-size:11px;color:#ffffffc9;margin-top:10px;letter-spacing:.3px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(min-width:600px){body{display:grid;place-items:center;background-color:#080812}.phone-ui{height:min(844px,96dvh);aspect-ratio:390/844;border:1px solid #ffffff25;border-radius:42px;overflow:hidden;box-shadow:0 30px 100px #0009}}
@media(max-height:720px){.lock-symbol{margin-top:12px}.clock{font-size:74px}.key{height:46px}.keypad{gap:6px}.auth-card{padding:13px 17px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="island" aria-hidden="true"></div>
<main class="phone-ui">
 <div class="status"><span id="statusTime">9:41</span><span class="status-right"><span>▂▄▆</span><span>⌁</span><span class="battery"></span></span></div>
 <div class="lock-symbol" aria-hidden="true">⌑</div>
 <div class="date" id="dateLine">Tuesday, June 9</div>
 <div class="clock" id="clock">9:41</div>
 <div class="spacer"></div>
 <section class="auth-card" aria-live="polite">
  <div class="auth-title" id="authTitle">Enter Passcode</div>
  <div class="auth-hint" id="authHint">Use your device passcode to unlock</div>
  <div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
  <div class="keypad" id="keypad">
   <button class="key" data-digit="1">1</button><button class="key" data-digit="2">2<small>ABC</small></button><button class="key" data-digit="3">3<small>DEF</small></button>
   <button class="key" data-digit="4">4<small>GHI</small></button><button class="key" data-digit="5">5<small>JKL</small></button><button class="key" data-digit="6">6<small>MNO</small></button>
   <button class="key" data-digit="7">7<small>PQRS</small></button><button class="key" data-digit="8">8<small>TUV</small></button><button class="key" data-digit="9">9<small>WXYZ</small></button>
   <button class="key empty" disabled></button><button class="key" data-digit="0">0</button><button class="key delete" id="deleteKey">Delete</button>
  </div>
  <div class="auth-actions"><button class="text-button" id="forgotBtn">Forgot Passcode?</button><button class="text-button" id="resetBtn" hidden>Reset demo</button></div>
 </section>
 <div class="bottom-row"><button class="round-action" aria-label="Flashlight">⌁</button><button class="round-action" aria-label="Camera">◎</button></div>
 <div class="swipe-note">Swipe up to unlock</div>
</main>
<script>
(()=>{'use strict';
const HASH_KEY='iphone-lock-passcode-hash-v1',SALT_KEY='iphone-lock-passcode-salt-v1',UNLOCK_KEY='iphoneUnlocked',ITERATIONS=180000;
const $=id=>document.getElementById(id);let digits='',mode='unlock',first='',busy=false;
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});$('statusTime').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('dateLine').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});}
setInterval(tick,1000);tick();
function updateDots(){[...$('dots').children].forEach((dot,i)=>dot.classList.toggle('filled',i<digits.length));}
function message(t,error=false){$('authHint').textContent=t;$('authHint').classList.toggle('error',error);}
function setMode(m){mode=m;digits='';first='';updateDots();$('resetBtn').hidden=m!=='unlock';$('authTitle').textContent=m==='create'?'Create Passcode':m==='confirm'?'Confirm Passcode':'Enter Passcode';message(m==='create'?'Choose a 4–6 digit passcode':m==='confirm'?'Enter it again to confirm':'Use your device passcode to unlock');}
async function digest(pin,salt){if(!crypto.subtle)throw new Error('Secure browser storage is unavailable. Open this page over HTTPS.');const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:ITERATIONS,hash:'SHA-256'},key,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function submit(){if(busy)return;busy=true;try{
 if(mode==='create'){if(digits.length<4){message('Use at least 4 digits',true);return;}first=digits;setMode('confirm');return;}
 if(mode==='confirm'){if(digits!==first){message('Passcodes do not match. Try again.',true);setMode('create');return;}const salt=crypto.getRandomValues(new Uint8Array(16));const saltText=[...salt].map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem(SALT_KEY,saltText);localStorage.setItem(HASH_KEY,await digest(digits,saltText));message('Passcode saved. Unlocking…');unlock();return;}
 const saltText=localStorage.getItem(SALT_KEY),expected=localStorage.getItem(HASH_KEY);if(!saltText||!expected){setMode('create');return;}const actual=await digest(digits,saltText);if(actual===expected){message('Unlocked');unlock();}else{digits='';updateDots();message('Incorrect passcode. Try again.',true);$('dots').classList.add('error');setTimeout(()=>$('dots').classList.remove('error'),500);}
 }catch(e){message(e.message||'Could not verify passcode',true);}finally{busy=false;}}
function unlock(){sessionStorage.setItem(UNLOCK_KEY,'1');location.replace('homescreen.html');}
function typeDigit(d){if(busy||digits.length>=6)return;digits+=d;updateDots();if(digits.length>=4){clearTimeout(window.__pinTimer);window.__pinTimer=setTimeout(()=>{if(digits.length>=4)submit();},350);}}
$('keypad').addEventListener('click',e=>{const b=e.target.closest('[data-digit]');if(b)typeDigit(b.dataset.digit);});
$('deleteKey').addEventListener('click',()=>{if(busy)return;digits=digits.slice(0,-1);updateDots();});
$('forgotBtn').addEventListener('click',()=>message('This local demo cannot recover a forgotten passcode. Use Reset demo to clear it on this browser.',true));
$('resetBtn').addEventListener('click',()=>{if(confirm('Reset this local iPhone demo passcode?')){localStorage.removeItem(HASH_KEY);localStorage.removeItem(SALT_KEY);sessionStorage.removeItem(UNLOCK_KEY);setMode('create');}});
let startY=0;document.addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(startY>innerHeight-100&&startY-e.changedTouches[0].clientY>45&&digits.length>=4)submit()},{passive:true});
if(!localStorage.getItem(HASH_KEY)||!localStorage.getItem(SALT_KEY))setMode('create');else setMode('unlock');
})();
</script>
</body></html>
