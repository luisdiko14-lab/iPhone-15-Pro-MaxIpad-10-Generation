<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heavy App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Menlo,monospace;height:100vh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}

/* Glitch overlay */
.glitch-overlay{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .1s}
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
.scanline{position:absolute;width:100%;height:3px;background:rgba(0,255,0,.08);animation:scanline 2s linear infinite}

/* Warning stripes */
@keyframes stripe-move{0%{background-position:0 0}100%{background-position:40px 0}}
.warning-stripe{position:fixed;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,#ff3b30 0,#ff3b30 20px,#000 20px,#000 40px);animation:stripe-move .4s linear infinite;z-index:10;opacity:0;transition:opacity .3s}
.warning-stripe.bottom{top:auto;bottom:0}

.app-icon-big{font-size:72px;margin-bottom:16px;filter:drop-shadow(0 0 20px #ff3b30);animation:pulse-icon 1s ease-in-out infinite}
@keyframes pulse-icon{0%,100%{filter:drop-shadow(0 0 20px #ff3b30)}50%{filter:drop-shadow(0 0 40px #ff6b00)}}

h1{font-size:22px;font-weight:700;margin-bottom:6px;text-align:center;color:#ff9500}
.sub{font-size:13px;color:#8e8e93;margin-bottom:30px;text-align:center;line-height:1.5}

/* RAM bar */
.stat-block{width:90%;max-width:360px;margin-bottom:16px}
.stat-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.stat-label span:first-child{color:#8e8e93}
.stat-label span:last-child{color:#ff3b30;font-weight:700}
.stat-bar{height:14px;background:#1c1c1e;border-radius:7px;overflow:hidden;position:relative}
.stat-fill{height:100%;border-radius:7px;transition:width .15s;position:relative;overflow:hidden}
.stat-fill::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0,rgba(255,255,255,.1) 10px,transparent 10px,transparent 20px);animation:stripe-move .3s linear infinite}
.fill-ram{background:linear-gradient(90deg,#ff9500,#ff3b30)}
.fill-cpu{background:linear-gradient(90deg,#af52de,#ff3b30)}
.fill-temp{background:linear-gradient(90deg,#30d158,#ff9500,#ff3b30)}

/* Log terminal */
.terminal{width:90%;max-width:360px;background:#0a0a0a;border:1px solid #1c1c1e;border-radius:10px;padding:10px 12px;height:130px;overflow-y:auto;font-size:10px;line-height:1.6;font-family:Menlo,monospace;margin-bottom:20px}
.log-line{color:#8e8e93}
.log-line.warn{color:#ff9500}
.log-line.err{color:#ff3b30}
.log-line.ok{color:#30d158}

/* Buttons */
.btn-row{display:flex;gap:10px;width:90%;max-width:360px}
.launch-btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#ff9500,#ff3b30);color:#fff;transition:opacity .15s}
.launch-btn:disabled{opacity:.4;cursor:not-allowed}
.cancel-btn{background:#1c1c1e;color:#ff3b30;border:none;border-radius:12px;padding:14px 18px;font-size:15px;font-weight:600;cursor:pointer}

/* Fan/crash overlay */
.crash-overlay{position:fixed;inset:0;background:#fff;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center}
.crash-overlay.show{display:flex}
.crash-emoji{font-size:80px;animation:spin .2s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.crash-msg{font-size:18px;font-weight:700;color:#000;margin-top:16px;text-align:center;padding:0 20px}
.crash-sub{font-size:13px;color:#636366;margin-top:8px;text-align:center;padding:0 20px}
.fan-ring{width:120px;height:120px;border-radius:50%;border:4px solid #ff3b30;display:flex;align-items:center;justify-content:center;margin-bottom:16px;animation:ring-pulse .15s ease-in-out infinite}
@keyframes ring-pulse{0%,100%{border-color:#ff3b30;transform:scale(1)}50%{border-color:#ff9500;transform:scale(1.05)}}

/* Boot screen */
.boot-screen{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center}
.boot-screen.show{display:flex}
.apple-logo-svg{width:60px;height:72px;fill:#fff}
.boot-progress{width:160px;height:3px;background:#1c1c1e;border-radius:2px;margin-top:40px;overflow:hidden}
.boot-progress-fill{height:100%;background:#fff;border-radius:2px;width:0;transition:width .1s}
</style>
</head>
<body>

<div class="warning-stripe" id="ws-top"></div>
<div class="warning-stripe bottom" id="ws-bot"></div>
<div class="glitch-overlay" id="glitch"><div class="scanline"></div></div>

<div class="app-icon-big">🤖</div>
<h1>HeavyLoad Pro</h1>
<div class="sub">Maximum Performance Benchmark<br><span style="color:#ff3b30;font-size:11px">⚠️ Uses all available system resources</span></div>

<div class="stat-block">
  <div class="stat-label"><span>RAM Usage</span><span id="ram-pct">0 MB / 12 GB</span></div>
  <div class="stat-bar"><div class="stat-fill fill-ram" id="ram-fill" style="width:0%"></div></div>
</div>
<div class="stat-block">
  <div class="stat-label"><span>CPU Load (20 cores)</span><span id="cpu-pct">0%</span></div>
  <div class="stat-bar"><div class="stat-fill fill-cpu" id="cpu-fill" style="width:0%"></div></div>
</div>
<div class="stat-block">
  <div class="stat-label"><span>Temperature</span><span id="temp-val">28°C</span></div>
  <div class="stat-bar"><div class="stat-fill fill-temp" id="temp-fill" style="width:10%"></div></div>
</div>

<div class="terminal" id="terminal"></div>

<div class="btn-row">
  <button class="cancel-btn" onclick="history.back()">Cancel</button>
  <button class="launch-btn" id="launch-btn" onclick="startBenchmark()">🚀 RUN BENCHMARK</button>
</div>

<!-- Fan / Crash overlay -->
<div class="crash-overlay" id="crash-overlay">
  <div class="fan-ring">
    <div style="font-size:48px;animation:spin .15s linear infinite;display:block">🌀</div>
  </div>
  <div class="crash-msg">🔥 THERMAL THROTTLING</div>
  <div class="crash-sub" id="crash-sub">Allocating 12 GB RAM…<br>All CPU cores at 100%<br>Fan speed: MAXIMUM</div>
  <div style="margin-top:20px;font-size:32px;animation:spin .3s linear infinite">💨</div>
</div>

<!-- Boot screen -->
<div class="boot-screen" id="boot-screen">
  <svg class="apple-logo-svg" viewBox="0 0 814 1000">
    <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 382.9 0 261 0 142.6c0-116 61.2-177.5 122.7-177.5 59.8 0 99.6 39.5 167.2 39.5 57.8 0 104.7-42.1 170.8-42.1 65.2 0 144.7 48.7 201.9 148.8zm-165.3-51.9c-26.1-31.5-61.7-51.9-101.3-51.9-69.5 0-123.1 54.2-150.5 94.4 23.9 6.5 57.2 18.1 94.6 18.1 69.5 0 128.2-40.8 157.2-60.6z"/>
  </svg>
  <div class="boot-progress"><div class="boot-progress-fill" id="boot-fill"></div></div>
</div>

<script>
let running=false;
const LOG_MSGS=[
  ['ok','[INIT] HeavyLoad Pro v9.1.3 starting…'],
  ['ok','[SYS] Detected: Snapdragon X Elite · 20 cores · 12 GB LPDDR5X'],
  ['warn','[ALLOC] Requesting 12,288 MB RAM from kernel…'],
  ['warn','[CPU] Spinning up all 20 cores to max frequency 3.8 GHz…'],
  ['err','[WARN] Thermal sensor: 58°C — approaching limit'],
  ['err','[WARN] RAM pressure CRITICAL — 11.9 GB allocated'],
  ['err','[FAN] Fan RPM: 6400 — MAXIMUM SPEED'],
  ['err','[KERN] kernel_task CPU: 89% — system unstable'],
  ['err','[THERM] CRITICAL THERMAL EVENT — 94°C'],
  ['err','[SYS] *** SYSTEM OVERLOAD — INITIATING EMERGENCY SHUTDOWN ***'],
];

const terminal=document.getElementById('terminal');
function addLog(type,msg){
  const el=document.createElement('div');
  el.className='log-line '+type;
  el.textContent=msg;
  terminal.appendChild(el);
  terminal.scrollTop=terminal.scrollHeight;
}

// Web Audio API — fan noise
let audioCtx=null,noiseNode=null,gainNode=null;
function startFanNoise(){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const bufLen=audioCtx.sampleRate*3;
  const buf=audioCtx.createBuffer(1,bufLen,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufLen;i++)data[i]=(Math.random()*2-1)*0.3;
  noiseNode=audioCtx.createBufferSource();
  noiseNode.buffer=buf;
  noiseNode.loop=false;
  // BPF to shape noise into fan-like whir
  const bpf=audioCtx.createBiquadFilter();
  bpf.type='bandpass';
  bpf.frequency.value=800;
  bpf.Q.value=0.5;
  // Add a low rumble oscillator
  const osc=audioCtx.createOscillator();
  osc.type='sawtooth';
  osc.frequency.value=60;
  const oscGain=audioCtx.createGain();
  oscGain.gain.value=0.08;
  osc.connect(oscGain);
  gainNode=audioCtx.createGain();
  gainNode.gain.value=0;
  noiseNode.connect(bpf);
  bpf.connect(gainNode);
  oscGain.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  noiseNode.start();
  osc.start();
  // Ramp up
  gainNode.gain.linearRampToValueAtTime(0.6,audioCtx.currentTime+0.3);
  return {osc,noiseNode};
}
function stopFanNoise(){
  if(!gainNode||!audioCtx)return;
  gainNode.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.5);
  setTimeout(()=>{try{audioCtx.close();}catch(e){}audioCtx=null;},600);
}

function startBenchmark(){
  if(running)return;
  running=true;
  document.getElementById('launch-btn').disabled=true;
  document.getElementById('launch-btn').textContent='⚡ Running…';
  terminal.innerHTML='';

  let ramPct=0,cpuPct=0,temp=28;
  let logIdx=0;

  const interval=setInterval(()=>{
    // Ramp up stats
    ramPct=Math.min(100,ramPct+(Math.random()*8+4));
    cpuPct=Math.min(100,cpuPct+(Math.random()*7+5));
    temp=Math.min(98,temp+(Math.random()*4+2));

    const ramGB=(ramPct/100*12).toFixed(2);
    document.getElementById('ram-fill').style.width=ramPct+'%';
    document.getElementById('cpu-fill').style.width=cpuPct+'%';
    document.getElementById('temp-fill').style.width=(temp-28)/70*100+'%';
    document.getElementById('ram-pct').textContent=ramGB+' GB / 12 GB';
    document.getElementById('cpu-pct').textContent=cpuPct.toFixed(1)+'%';
    document.getElementById('temp-val').textContent=temp.toFixed(0)+'°C';

    // Add log lines
    if(logIdx<LOG_MSGS.length){
      addLog(LOG_MSGS[logIdx][0],LOG_MSGS[logIdx][1]);
      logIdx++;
    }

    // Show warning stripes when hot
    if(temp>60){
      document.getElementById('ws-top').style.opacity='1';
      document.getElementById('ws-bot').style.opacity='1';
      document.getElementById('glitch').style.opacity='1';
    }

    // Trigger crash at ~3 seconds
    if(ramPct>=95){
      clearInterval(interval);
      triggerCrash();
    }
  },200);
}

function triggerCrash(){
  // Show crash overlay + start fan
  document.getElementById('crash-overlay').classList.add('show');
  const {osc}=startFanNoise();

  let t=0;
  const msgs=[
    'Allocating 12 GB RAM… ✓',
    'All 20 CPU cores: 100% ✓',
    'Fan RPM: 6,400 MAX 💨',
    '⚠️ Temp: 94°C CRITICAL',
    '🔴 System unstable — shutting down…'
  ];
  const msgEl=document.getElementById('crash-sub');
  const msgInterval=setInterval(()=>{
    if(t<msgs.length)msgEl.innerHTML=msgs.slice(0,t+1).join('<br>');
    t++;
  },500);

  // Shake the page
  document.body.style.animation='none';
  let shake=0;
  const shakeInterval=setInterval(()=>{
    document.body.style.transform=`translateX(${(Math.random()-0.5)*10}px)`;
    shake++;
    if(shake>15){clearInterval(shakeInterval);document.body.style.transform='';}
  },80);

  // After 3 seconds, boot sequence
  setTimeout(()=>{
    clearInterval(msgInterval);
    stopFanNoise();
    document.getElementById('crash-overlay').classList.remove('show');
    document.getElementById('ws-top').style.opacity='0';
    document.getElementById('ws-bot').style.opacity='0';
    document.getElementById('glitch').style.opacity='0';
    // Flash white then boot
    document.body.style.background='#fff';
    setTimeout(()=>{
      document.body.style.background='#000';
      document.getElementById('boot-screen').classList.add('show');
      bootProgress();
    },200);
  },3000);
}

function bootProgress(){
  const fill=document.getElementById('boot-fill');
  let w=0;
  const iv=setInterval(()=>{
    w=Math.min(100,w+Math.random()*6+2);
    fill.style.width=w+'%';
    if(w>=100){
      clearInterval(iv);
      setTimeout(()=>window.location.href='homescreen.html',400);
    }
  },80);
}
</script>
</body>
</html>
