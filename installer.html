<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Installer</title>
    <style>
        :root {
            --bg-primary: #000;
            --bg-secondary: #1c1c1e;
            --text-primary: #fff;
            --text-secondary: #8e8e93;
            --blue: #0a84ff;
            --border: #38383a;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .installer-card {
            width: 90%;
            max-width: 400px;
            background-color: var(--bg-secondary);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .drive-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .drive-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .drive-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--blue);
        }

        .drive-icon {
            font-size: 24px;
            margin-right: 16px;
        }

        .drive-info {
            flex: 1;
        }

        .drive-name {
            font-weight: 600;
            font-size: 16px;
        }

        .drive-details {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .install-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 32px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .install-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .install-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="installer-card">
        <h1>Select Installation Drive</h1>
        <p class="subtitle">Choose where you want to install the system</p>
        
        <div class="drive-list">
            <div class="drive-item" onclick="selectDrive(this, 'A')">
                <span class="drive-icon">📱</span>
                <div class="drive-info">
                    <div class="drive-name">A: Main iPhone Drive</div>
                    <div class="drive-details">256 GB Total • 240 GB Available</div>
                </div>
            </div>

            <div class="drive-item" onclick="selectDrive(this, 'B')">
                <span class="drive-icon">💾</span>
                <div class="drive-info">
                    <div class="drive-name">B: /USB Drive</div>
                    <div class="drive-details">64 GB Total • 64 GB Available</div>
                </div>
            </div>

            <div class="drive-item" onclick="selectDrive(this, 'C')">
                <span class="drive-icon">🪟</span>
                <div class="drive-info">
                    <div class="drive-name">C: /Windows 11</div>
                    <div class="drive-details">0.1 MB space available • System partition</div>
                </div>
            </div>
        </div>

        <button id="installBtn" class="install-btn" disabled onclick="startInstall()">Install System</button>
    </div>

    <script>
        let selectedDriveLetter = null;

        function selectDrive(element, letter) {
            // Remove selection from others
            document.querySelectorAll('.drive-item').forEach(item => {
                item.style.borderColor = 'var(--border)';
                item.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
            });

            // Select this one
            element.style.borderColor = 'var(--blue)';
            element.style.backgroundColor = 'rgba(10, 132, 255, 0.1)';
            
            selectedDriveLetter = letter;
            
            // Enable button if not Drive C (mocking low space logic)
            const installBtn = document.getElementById('installBtn');
            if (letter === 'C') {
                installBtn.disabled = true;
                installBtn.textContent = 'Insufficient Space on C:';
            } else {
                installBtn.disabled = false;
                installBtn.textContent = 'Install on ' + letter + ':';
            }
        }

        function startInstall() {
            if (!selectedDriveLetter) return;
            const btn = document.getElementById('installBtn');
            btn.disabled = true;
            btn.textContent = 'Installing...';
            
            setTimeout(() => {
                window.location.href = 'setup.html';
            }, 1500);
        }
    </script>
</body>
</html>
