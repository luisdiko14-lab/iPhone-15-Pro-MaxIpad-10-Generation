<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Installer</title>
    <style>
        :root {
            --bg-primary: #000;
            --bg-secondary: #1c1c1e;
            --text-primary: #fff;
            --text-secondary: #8e8e93;
            --blue: #0a84ff;
            --border: #38383a;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .installer-card {
            width: 90%;
            max-width: 400px;
            background-color: var(--bg-secondary);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.5s ease;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .drive-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .drive-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .drive-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--blue);
        }

        .drive-icon {
            font-size: 24px;
            margin-right: 16px;
        }

        .drive-info {
            flex: 1;
        }

        .drive-name {
            font-weight: 600;
            font-size: 16px;
        }

        .drive-details {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .install-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 32px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .install-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .install-btn:active {
            opacity: 0.8;
        }

        /* Progress Screen */
        .progress-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background-color: #333;
            border-radius: 3px;
            margin: 30px 0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #fff;
            transition: width 0.3s linear;
        }

        .status-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .percent-text {
            font-size: 18px;
            font-weight: 600;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="installer-card" id="selectionCard">
        <h1>Select Installation Drive</h1>
        <p class="subtitle">Choose where you want to install the system</p>
        
        <div class="drive-list">
            <div class="drive-item" onclick="selectDrive(this, 'A', 'Main iPhone Drive')">
                <span class="drive-icon">📱</span>
                <div class="drive-info">
                    <div class="drive-name">A: Main iPhone Drive</div>
                    <div class="drive-details">2 TB Total • 1.99 TB Available</div>
                </div>
            </div>

            <div class="drive-item" onclick="selectDrive(this, 'B', '/USB Drive')">
                <span class="drive-icon">💾</span>
                <div class="drive-info">
                    <div class="drive-name">B: /USB Drive</div>
                    <div class="drive-details">256 GB Total • 126 GB Available</div>
                </div>
            </div>

            <div class="drive-item" onclick="selectDrive(this, 'C', '/Windows 11')">
                <span class="drive-icon">🪟</span>
                <div class="drive-info">
                    <div class="drive-name">C: /Windows 11</div>
                    <div class="drive-details">0.1 MB space available • System partition</div>
                </div>
            </div>
        </div>

        <button id="installBtn" class="install-btn" disabled onclick="startInstall()">Install System</button>
    </div>

    <div class="installer-card progress-screen" id="progressCard">
        <h1 id="progressTitle">Installing to Drive A:</h1>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="percent-text" id="percentText">0%</div>
        <div class="status-text" id="statusText">Preparing installation...</div>
    </div>

    <script>
        let selectedDriveLetter = null;
        let selectedDriveName = null;

        function selectDrive(element, letter, name) {
            document.querySelectorAll('.drive-item').forEach(item => {
                item.style.borderColor = 'var(--border)';
                item.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
            });

            element.style.borderColor = 'var(--blue)';
            element.style.backgroundColor = 'rgba(10, 132, 255, 0.1)';
            
            selectedDriveLetter = letter;
            selectedDriveName = name;
            
            const installBtn = document.getElementById('installBtn');
            if (letter === 'C') {
                installBtn.disabled = true;
                installBtn.textContent = 'Insufficient Space on C:';
            } else {
                installBtn.disabled = false;
                installBtn.textContent = 'Install on ' + letter + ':';
            }
        }

        function startInstall() {
            if (!selectedDriveLetter) return;
            
            document.getElementById('selectionCard').style.display = 'none';
            document.getElementById('progressCard').style.display = 'flex';
            document.getElementById('progressTitle').textContent = 'Installing to ' + selectedDriveName;
            
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');
            const percentText = document.getElementById('percentText');
            
            const steps = [
                { percent: 20, text: 'Installing Updates...' },
                { percent: 45, text: 'Installing Apps...' },
                { percent: 70, text: 'Installing iOS...' },
                { percent: 90, text: 'Installing System...' },
                { percent: 100, text: 'Finalizing...' }
            ];
            
            let currentStep = 0;
            let currentPercent = 0;
            
            const interval = setInterval(() => {
                currentPercent += 1;
                progressBar.style.width = currentPercent + '%';
                percentText.textContent = currentPercent + '%';
                
                if (currentStep < steps.length && currentPercent >= steps[currentStep].percent) {
                    statusText.textContent = steps[currentStep].text;
                    currentStep++;
                }
                
                if (currentPercent >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1000);
                }
            }, 50);
        }
    </script>
</body>
</html>
