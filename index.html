<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Setup</title>
    <style>
        :root {
            --bg-primary: #000;
            --text-primary: #fff;
            --blue: #0a84ff;
        }

        body {
            margin: 0;
            font-family: -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .setup-card {
            text-align: center;
            padding: 40px;
        }

        h1 { font-size: 32px; margin-bottom: 20px; }
        p { color: #8e8e93; margin-bottom: 40px; }

        .btn {
            background-color: var(--blue);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="setup-card">
        <h1>Welcome to iPhone</h1>
        <p>Your new iPhone is ready to be configured.</p>
        <a href="installer.html" class="btn">Get Started</a>
    </div>
</body>
</html>
