<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMware Installer</title>
    <link rel="stylesheet" href="installer.css">
</head>
<body>
    <div class="installer-container">
        <div class="glass-box">
            <header>
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/VMware_logo_2020.svg" alt="VMware" class="logo">
                <h1>VMware Fusion Pro</h1>
                <p>Choose your operating system to install</p>
            </header>

            <div class="device-selection">
                <div class="device-card active" id="iosCard" onclick="selectDevice('ios')">
                    <div class="device-icon">📱</div>
                    <h3>iOS 17</h3>
                    <p>Replica iPhone Experience</p>
                    <div class="badge">Recommended</div>
                </div>

                <div class="device-card" id="winCard" onclick="selectDevice('windows')">
                    <div class="device-icon">🪟</div>
                    <h3>Windows 10</h3>
                    <p>Professional Edition</p>
                    <div class="badge">Available</div>
                </div>
            </div>

            <div class="installer-footer">
                <button id="installBtn" onclick="startInstallation()">Install Now</button>
            </div>

            <div id="progressSection" class="hidden">
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
                <p id="statusText">Preparing installation...</p>
            </div>
        </div>
    </div>
    <script src="installer.js"></script>
</body>
</html>
